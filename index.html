<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="사업 개요를 넣으면 심의·영향평가 대상을 판정하고 인허가 일정표를 만드는 도구">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%231a4f9c%27/%3E%3Crect x=%277%27 y=%279%27 width=%2712%27 height=%274%27 rx=%271%27 fill=%27%23fff%27/%3E%3Crect x=%2712%27 y=%2716%27 width=%2713%27 height=%274%27 rx=%271%27 fill=%27%23c8961e%27/%3E%3C/svg%3E">
</head>
<body>
<title>인허가 타임라인</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: 상단 프로젝트 바 → 단계 탭(개요·판정·일정) → 탭별 작업면. 일정 탭은 간트(좌) + 속성 패널(우). */
:root{
  --bg:var(--rv-page); --surface:var(--rv-surface); --surface2:var(--rv-tot); --fg:var(--rv-ink); --muted:var(--rv-sub); --line:var(--rv-line); --line2:var(--rv-line2);
  --accent:var(--rv-band); --accent-weak:var(--rv-band-weak); --accent-fg:#ffffff; --gold:#b9861a; --gold-weak:#faf2de;
  --ok:var(--rv-ok); --ok-weak:var(--rv-ok-bg); --warn:var(--rv-no); --warn-weak:var(--rv-no-bg); --no:#6a7484; --no-weak:#eceff3; --danger:#b3261e;
  --today:#d0342c; --shadow:none;
  --f-body:"Pretendard Variable",Pretendard,"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --accent:#7aa5ea; --accent-fg:#0e131a; --gold:#e0b04a; --gold-weak:#3a2f15;
  --no:#9aa4b4; --no-weak:#232c38; --danger:#ff8a80;
  --today:#ff6b61; color-scheme:dark;}}
:root[data-theme="dark"]{
  --accent:#7aa5ea; --accent-fg:#0e131a; --gold:#e0b04a; --gold-weak:#3a2f15;
  --no:#9aa4b4; --no-weak:#232c38; --danger:#ff8a80;
  --today:#ff6b61; color-scheme:dark;}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:10px;background:var(--rv-band);color:#fff;border-bottom:1px solid var(--rv-band)}
.top .brand small,.top .save{color:rgba(255,255,255,.78)}
.top .btn{background:transparent;border-color:rgba(255,255,255,.5);color:#fff}
.top .btn:hover{border-color:#fff}
.top .btn.pri{background:var(--rv-in);border-color:var(--rv-in);color:var(--rv-in-ink);font-weight:700}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand b{font-size:14px;font-weight:700;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:11px}
.proj{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.proj select{max-width:280px}
.grow{flex:1}
.save{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.save i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.save.busy i{background:var(--gold)} .save.local i{background:var(--no)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:0;padding:5px 10px;cursor:pointer;white-space:nowrap;line-height:1.4}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
select,input[type=text],input[type=number],input[type=month],input[type=password],textarea{border:1px solid var(--line);background:var(--rv-in);color:var(--rv-in-ink);font-weight:600;border-radius:0;padding:5px 8px;min-width:0}
textarea{resize:vertical}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:0;box-shadow:none;padding:6px;z-index:50;min-width:210px;display:flex;flex-direction:column}
.menu-pop[hidden]{display:none}
.menu-pop button{text-align:left;border:0;background:none;padding:7px 10px;border-radius:0;cursor:pointer}
.menu-pop button:hover{background:var(--accent-weak)}
.menu-pop small{color:var(--muted);display:block;font-size:11px}
/* tabs */
.tabs{display:flex;gap:0;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;padding-top:6px}
.tab{border:1px solid var(--line);background:var(--surface2);padding:8px 14px;margin-right:-1px;margin-bottom:-1px;cursor:pointer;color:var(--muted);border-radius:0;display:flex;gap:8px;align-items:center;white-space:nowrap}
.tab .no{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--fg);background:var(--surface);border-bottom-color:var(--surface);box-shadow:inset 0 3px 0 var(--accent);font-weight:600}
.tab .cnt.warn{background:var(--warn-weak);color:var(--warn)}
.tab .cnt{font-size:11px;background:var(--accent-weak);color:var(--accent);border-radius:0;padding:0 7px;font-weight:600}
main{min-height:0;overflow:hidden;position:relative}
.view{height:100%;overflow:auto}
.view[hidden]{display:none}
/* input form */
.form{max-width:1240px;margin:0 auto;padding-block:14px 28px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.fmain{display:grid;gap:10px;min-width:0;align-content:start}
.side{display:grid;gap:10px;align-content:start}
.sidebox{background:var(--surface);border:1px solid var(--line);padding:10px 12px}
.sidebox h3{font-size:13px;margin:0 0 8px}
.rbar{display:flex;align-items:baseline;gap:8px}.rbar b{font:500 20px var(--f-mono)}.rbar span{font-size:12px;color:var(--muted)}
.rtrack{height:4px;background:var(--line2);margin:6px 0 8px}.rtrack i{display:block;height:100%;background:var(--accent)}
.rmiss{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--warn);background:var(--warn-weak);padding:2px 8px;font-size:12px;cursor:pointer}
.note.ok{color:var(--ok)}
.form .fld{position:relative}
.rqh{display:none;position:absolute;left:0;top:100%;margin-top:2px;z-index:5;max-width:260px;padding:4px 8px;font-size:12px;color:var(--fg);background:var(--surface);border:1px solid var(--warn)}
.fld:hover > .rqh:not([hidden]),.fld:focus-within > .rqh:not([hidden]){display:block}
.form input.rqbad{border-color:var(--warn)}
.rq{font-style:normal;font-size:10.5px;color:var(--muted);border:1px solid var(--line);padding:0 4px;margin-left:5px}
.form .fld label{font-size:13px}.form .fld .hint{font-size:12px}
.form input,.form select{font-size:14px;min-height:30px;padding:3px 8px;font-weight:500;background:color-mix(in srgb,var(--rv-in) 45%,var(--surface))}
.form .sec,.form .ofold > .sec,.form .ofold > .ofbody{padding:10px 14px}
.form .grid{gap:6px 10px}
@media (min-width:1100px){.form{grid-template-columns:minmax(0,1fr) 270px}.side{position:sticky;top:12px;align-self:start}}
@media (pointer:coarse){.form input,.form select{min-height:40px}}
.sec{--h:var(--rv-slate-h);--t:var(--rv-slate-t);background:var(--surface);border:1px solid var(--line);border-radius:0;box-shadow:none;padding:16px 18px}
.sec h2{font-size:13.5px;margin:-16px -18px 14px;padding:7px 18px;background:var(--h);color:var(--rv-ink);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
.sec h2 small{font-weight:400;color:var(--rv-ink);font-size:12px}
.sec.req .hint{display:none}
.req-note{margin:10px 0 0}
.ofold{border:1px solid var(--line);background:var(--surface);--h:var(--rv-slate-h)}
.ofold.t1{--h:var(--rv-mint-h)}.ofold.t2{--h:var(--rv-sand-h)}.ofold.t3{--h:var(--rv-blue-h)}.ofold.t4{--h:var(--rv-lav-h)}
.ofold > summary{cursor:pointer;font-size:13.5px;font-weight:700;padding:7px 18px;background:var(--h);color:var(--rv-ink);display:flex;gap:8px;align-items:baseline}
.ofold > summary small{font-weight:400;font-size:12px}
.ofold[open] > summary{border-bottom:1px solid var(--line)}
.ofold > .sec,.ofold > .ofbody{border:0;padding:16px 18px}
.ofold .sec > h2{display:none}
.ofold .sec > p.note{display:none}
.ofold .ofbody > .fld{max-width:260px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 10px}
.zfold{margin-top:12px}
.zfold > summary{cursor:pointer;font-size:12.5px;font-weight:700;padding:6px 10px;border:1px solid var(--line);background:var(--rv-blue-t);color:var(--rv-ink)}
.zfold[open] > summary{margin-bottom:8px}
.zfold .tbl-wrap{margin-top:0!important}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12px;color:var(--muted)}
.fld .hint{font-size:11px;color:var(--muted)}
.fld .src{font-size:11px;color:var(--accent);line-height:1.4}
.unk{font-style:normal;font-size:10.5px;font-weight:600;color:var(--warn);background:var(--warn-weak);border-radius:0;padding:0 5px;margin-left:4px}
.memo{width:100%;min-height:120px;line-height:1.55}
.fld input,.fld select{width:100%}
.num{font-variant-numeric:tabular-nums}
.unit{display:flex;align-items:center;gap:6px}.unit span{color:var(--muted);font-size:12px;white-space:nowrap}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 14px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line2);border-radius:0;cursor:pointer}
.chk:hover{border-color:var(--line)}
.chk input{margin-top:3px}
.chk small{display:block;color:var(--muted);font-size:11.5px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{font-size:12px;color:var(--muted)}
.banner{border-radius:0;padding:10px 14px;font-size:12.5px;border:1px solid}
.banner.warn{background:var(--warn-weak);border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--fg)}
.banner.info{background:var(--accent-weak);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
/* verdict */
.vwrap{max-width:1280px;margin:0 auto;padding-block:20px 40px;display:grid;gap:14px}
.sum{display:flex;gap:0;flex-wrap:wrap;align-items:stretch;background:var(--surface);border:1px solid var(--line)}
.sum .k{background:transparent;border:0;border-right:1px solid var(--line);border-radius:0;padding:10px 16px;min-width:120px}
.sum .k b{font-size:22px;font-family:var(--f-mono);font-weight:500;display:block;line-height:1.2}
.sum .k span{font-size:12px;color:var(--muted)}
.sum .path{flex:1;min-width:240px;display:flex;flex-direction:column;justify-content:center}
.sum .path b{font-family:var(--f-body);font-size:15px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:0}
.vsplit{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.vcol{display:grid;gap:8px;min-width:0}
.vcol.q{grid-column:1/-1}
.vcol h3{margin:0;padding:8px 12px;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--surface2);color:var(--fg)}
.vcol.Y h3{background:var(--ok-weak);color:var(--ok)} .vcol.Q h3{background:var(--warn-weak);color:var(--warn)} .vcol.N h3{background:var(--no-weak);color:var(--no)}
.vcard{border:1px solid var(--line);background:var(--surface);padding:10px 12px;display:grid;gap:6px;min-width:0}
.vc-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vc-h .nm{font-weight:700}
.vc-cat{font-size:11px;color:var(--muted)}
.vcard .why{font-size:13px}
/* 상태는 색만이 아니라 기호와 글자로도 구분한다 */
.vcard .pill::before,.vcol h3::before{display:inline-block;width:1.1em;text-align:center;font-weight:700}
.vcol.Y h3::before,.vcard .pill.Y::before{content:"✓"}
.vcol.N h3::before,.vcard .pill.N::before{content:"–"}
.vcol.Q h3::before,.vcard .pill.Q::before{content:"?"}
.vcol.Y .vcard{border-left:3px solid var(--ok)}.vcol.Q .vcard{border-left:3px solid var(--warn)}.vcol.N .vcard{border-left:3px solid var(--no)}
.vcol.M h3{background:var(--warn-weak);color:var(--warn)}.vcol.M .vcard{border-left:3px dashed var(--warn)}.pill.M{background:var(--warn-weak);color:var(--warn);outline:1px dashed currentColor}
.vcol.M h3::before,.vcard .pill.M::before{content:"…"}
/* 입력 부족 규칙은 확인 필요 규칙보다 뒤에 둔다 (class 'q'와 'Q'를 같게 보는 렌더링 모드 대비) */
.vcard .ref{font-size:12px;color:var(--accent);margin-top:4px}
.vcard details{font-size:12px}
.vcard summary{cursor:pointer;color:var(--muted)}
.vcard .law{font-size:12px;color:var(--muted);margin-top:4px}
.vcard .memo{font-size:11.5px;color:var(--muted);margin-top:4px}
.vc-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vc-f select{margin-left:auto;min-width:96px}
.vcol .empty{padding:10px 12px;color:var(--muted);font-size:12px;border:1px dashed var(--line)}
@media (max-width:899.98px){.vsplit{grid-template-columns:1fr}}
table.vt{border-collapse:collapse;width:100%;min-width:980px}
.vt th{font-size:11.5px;color:var(--rv-ink);font-weight:700;text-align:left;padding:9px 12px;border:1px solid var(--line);background:var(--rv-blue-t);position:sticky;top:0}
.vt td{padding:9px 12px;border:1px solid var(--line);vertical-align:top}
.vt tr.cat td{background:var(--rv-slate-h);font-weight:700;font-size:12px;color:var(--rv-ink);padding:6px 12px}
.vt .nm{font-weight:600}
.vt .why{color:var(--fg)}
.vt .law{font-size:12px;color:var(--muted)}
.vt .memo{font-size:11.5px;color:var(--muted);margin-top:4px}
.vt .ref{font-size:12px;color:var(--accent);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:0;padding:1px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.Y{background:var(--ok-weak);color:var(--ok)} .pill.N{background:var(--no-weak);color:var(--no)} .pill.Q{background:var(--warn-weak);color:var(--warn)}
.pill.ov{outline:1px dashed currentColor}
.conf{font-size:11px;white-space:nowrap;border-radius:0;padding:1px 6px;border:1px solid var(--line)}
.conf.A{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.conf.C{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
/* gantt */
.gview{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:100%}
.gmain{display:grid;grid-template-rows:auto 1fr;min-width:0;min-height:0}
.gtool{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:var(--rv-slate-t);border-bottom:1px solid var(--line)}
.gtool .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.gtool .zoom{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);min-width:64px;text-align:center}
.gscroll{overflow:auto;position:relative;background:var(--surface);min-height:0}
.gbody{position:relative;min-width:max-content}
.g-row{display:flex;height:30px;border-bottom:1px solid var(--line2)}
.g-left{position:sticky;left:0;z-index:3;background:var(--surface);display:flex;align-items:center;border-right:1px solid var(--line);flex:none}
.g-left .c-nm{flex:1;min-width:0;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-left .c-ow{width:64px;padding:0 8px;color:var(--muted);font-size:12px;border-left:1px solid var(--line2);height:100%;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.g-left .c-nt{width:150px;padding:0 8px;color:var(--muted);font-size:11.5px;border-left:1px solid var(--line2);height:100%;display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.g-time{position:relative;flex:none;background-image:linear-gradient(to right,var(--line2) 1px,transparent 1px);}
.g-row.sel .g-left,.g-row.sel .g-time{background-color:var(--accent-weak)}
.g-row.grp{height:28px;background:var(--rv-slate-h)}
.g-row.grp .g-left{background:var(--rv-slate-h);color:var(--rv-ink);font-weight:600;font-size:12px}
.g-row.grp .g-time{background-image:none}
.g-row.grp .c-nm{display:flex;gap:6px;align-items:center}
.g-row.grp .c-nm em{font-style:normal;color:var(--muted);font-weight:400;font-family:var(--f-mono);font-size:11px}
.g-row.item .c-nm{padding-left:22px;cursor:pointer}
.g-row.item .c-nm .tag{font-size:10.5px;color:var(--warn);margin-left:6px}
.g-head{position:sticky;top:0;z-index:5;height:auto;background:var(--surface);border-bottom:1px solid var(--line)}
.g-head .g-left{z-index:6;height:44px;font-size:11.5px;color:var(--muted);align-items:flex-end;padding-bottom:6px}
.g-head .g-time{height:44px;background-image:none}
.hm{position:absolute;top:0;height:26px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;border-left:1px solid var(--line2);white-space:nowrap;overflow:hidden}
.hm.yr{border-left-color:var(--line)}
.hq{position:absolute;top:26px;height:18px;font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono)}
.bar{position:absolute;top:6px;height:18px;border-radius:4px;cursor:grab;display:flex;align-items:center;padding:0 6px;font-size:11px;color:#fff;white-space:nowrap;overflow:hidden;font-family:var(--f-mono);touch-action:none;user-select:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.bar.tent{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 4px,transparent 4px 8px);outline:1.5px dashed var(--warn);outline-offset:1px}
.bar.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.bar .h{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize}
.bar .h.l{left:0}.bar .h.r{right:0}
.bar.dark-text{color:#14202f}
.ms{position:absolute;top:7px;width:16px;height:16px;margin-left:-8px;cursor:grab;touch-action:none}
.ms i{position:absolute;inset:2px;transform:rotate(45deg);border-radius:2px;box-shadow:0 0 0 1.5px var(--surface)}
.ms.sel i{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.ms span{position:absolute;left:16px;top:-1px;font-size:11px;white-space:nowrap;color:var(--fg);pointer-events:none}
.bar-lbl{position:absolute;top:6px;font-size:11px;color:var(--muted);white-space:nowrap;pointer-events:none;line-height:18px}

 {id:'integ', cat:'심의', name:'통합심의', late:true, law:'주택법 제18조①② (법률 제21902호, 시행 2026.9.8., 확인 2026-11-05) / 도시정비법 제50조의2① (법률 제21447호, 시행 2026.7.1., 확인 2026-11-05)', conf:'A',
  memo:'주택법: 승인권자는 건축심의·도시·군관리계획·광역교통 개선대책·교통영향평가·경관심의·교육환경평가·성능위주설계 평가·재해영향평가 등을 통합심의할 수 있고(①), 사업계획승인 신청자가 신청하면 의무(②). 환경영향평가는 목록에 없음. 도시정비법: 건축(특별건축구역 포함)·경관·교육환경평가·도시·군관리계획·교통영향평가·성능위주설계 평가·재해영향평가·환경영향평가 등 사업시행계획인가 관련 심의가 둘 이상 필요하면 통합심의 의무. 건축법 경로: 통합심의 규정 없음 — 분야별 개별 심의.',
  fn: (c,V) => {
    if (c.path==='housing') return Y('사업계획승인 대상 → 통합심의를 신청하면 의무 (주택법 제18조② 신청 시 의무, ① 승인권자 재량)');
    if (c.path!=='redev') return N('건축허가 사업 — 분야별 개별 심의');
    const L = INTEG_BUNDLE.filter(([, ids]) => ids.some(i => V[i] && (V[i].s==='Y' || V[i].s==='Q'))).map(([nm]) => nm);
    return L.length>=2 ? Y(`사업시행계획인가 관련 심의 ${L.length}개 (${L.join('·')}) ≥ 2 → 통합심의 의무 (도시정비법 제50조의2①)`)
      : Q(`관련 심의가 둘 미만 (${L.join('·') || '없음'}) — 통합심의 의무 아님, 확인`);
  }},
 {id:'bc_metro', cat:'심의', name:'건축위원회 심의 (시·도)', law:'건축법 제11조, 시행령 제8조 · 서울시 건축조례 제7조①1다 [시행 2026.3.30.]', conf:'A',
  memo:'서울: 심의대상건축물(다중이용건축물·시가지/특화경관지구 내·분양 목적) 중 연면적 합계 10만㎡ 이상 또는 21층 이상 → 시 건축위원회. 다른 시·도는 건축조례로 확인(21층·10만㎡ 이상은 시행령 제8조 광역 허가·도지사 승인 대상).',
  fn: c => {
    const big = c.floors>=21 || c.gfa>=100000;
    const why = [c.floors>=21?`지상 ${c.floors}층 ≥ 21층`:'', c.gfa>=100000?`연면적 ${fA(c.gfa)} ≥ 100,000.00㎡`:''].filter(Boolean).join(', ');
    if (!big) return N(`지상 ${c.floors}층 < 21층, 연면적 ${fA(c.gfa)} < 100,000.00㎡`);
    if (c.isSeoul) return c.bcTarget ? Y(`${why} · ${c.bcTargetWhy}`) : Q(`${why} — 심의대상건축물(다중이용·분양·경관지구) 여부 확인`);
    return Y(`${why} — ${c.sido} 건축조례로 심의 주체 확인`);

 {id:'bc_local', cat:'심의', name:'건축위원회 심의 (시·군·구)', law:'서울시 건축조례 제7조①2다 [시행 2026.3.30.] · 각 시·군·구 건축조례', conf:'A',
  memo:'서울 구 위원회: 심의대상건축물 중 시 위원회 대상이 아닌 것. 분양 목적이면 연면적 합계 3,000㎡ 이상, 공동주택 30세대(단지형 50세대) 이상, 오피스텔 50실 이상. 다른 시·도는 조례 확인.',
  fn: (c,V) => {
    if (V.bc_metro.s==='Y') return N('시·도 건축위원회 심의 대상');
    if (c.multi) return Y(c.floors>=16 ? `다중이용건축물: 지상 ${c.floors}층 ≥ 16층` : `다중이용건축물: ${USES[c.use]} 연면적 ${fA(c.gfa)} ≥ 5,000.00㎡`);
    if (c.isSeoul) {
      if (c.f.scenicZone) return Y('시가지·특화경관지구 등 경관지구 내 건축물(입력)');
      if (c.sale) {
        if (c.res && c.hh>=30) return Y(`분양 공동주택 ${c.hh}세대 ≥ 30세대`);
        if (c.use==='officetel' && c.hh>=50) return Y(`분양 오피스텔 ${c.hh}실 ≥ 50실`);
        if (c.gfa>=3000) return Y(`분양 목적 연면적 ${fA(c.gfa)} ≥ 3,000.00㎡`);
      }
      return N('서울 건축조례 심의대상 기준 미만');
    }
    if (c.res && c.hh>=30) return Q(`공동주택 심의 대상 여부 — ${c.sido} 건축조례 확인`);
    return N('다중이용건축물 아님 — 조례 확인 권장');
  }},
 {id:'excav', cat:'심의', name:'굴토 심의', law:'서울시 건축조례 제7조①1사·2라 [시행 2026.3.30.]', conf:'A',
  memo:'서울: 깊이 10m 이상 또는 지하 2층 이상 굴착, 높이 5m 이상 옹벽 설치 공사 설계(석축·노후건축물 인접 등 추가 요건 있음). 건축법 시행령 제5조의5에서는 해당 호가 삭제되어 조례로 운영 — 다른 시·도는 조례 확인.',
  fn: c => {
    const hit = c.depth>=10 || c.basements>=2;
    if (!hit) return N(`굴착깊이 ${f1(c.depth)}m < 10m, 지하 ${c.basements}층 < 2층`);
    const why = `굴착깊이 ${f1(c.depth)}m${c.depthEst?'(추정)':''}, 지하 ${c.basements}층`;
    return c.isSeoul ? Y(why) : Q(`${why} — ${c.sido} 건축조례 확인`);
  }},
 {id:'struct', cat:'심의', name:'구조안전 심의', law:'건축법 시행령 제5조의5①4호, 제2조17호·18호 [시행 2026.10.6.]', conf:'A',
  memo:'다중이용건축물(16층 이상, 또는 문화집회·종교·판매·여객·종합병원·관광숙박 바닥면적 합계 5,000㎡ 이상)과 특수구조 건축물의 구조안전 — 착공신고 전 지방건축위원회 심의.',
  fn: c => c.f.special ? Y('특수구조 건축물(입력)') : c.multi ? Y(c.floors>=16 ? `다중이용건축물: 지상 ${c.floors}층 ≥ 16층` : `다중이용건축물: ${USES[c.use]} ≥ 5,000.00㎡`) : N('다중이용·특수구조 건축물 아님')},
 {id:'landscape', cat:'심의', name:'경관심의 (건축물)', law:'경관법 제28조 · 서울시 경관조례 제24조 [시행 2025.9.29.]', conf:'A',
  memo:'서울: ①경관지구 내 4층 또는 16m 초과·건폐율 40% 초과 ②중점경관관리구역 내 경관계획이 정한 건축물 ③지자체·공공기관·지방공기업이 짓는 허가(협의) 대상 ④다중이용건축물(16층 이상 등). 주택건설사업 등 개발사업 경관심의(경관법 제27조)는 원문 미대조.',
  fn: c => {
    if (c.isSeoul) {
      if (c.f.scenicZone) return Y('경관지구 내(입력) — 4층 또는 16m 초과·건폐율 40% 초과 요건 확인');
      if (c.f.scenicKey) return Q('중점경관관리구역 내(입력) — 경관계획이 정한 건축물인지 확인');
      if (c.pub) return Y('공공기관 등이 짓는 허가(협의) 대상 건축물');
      if (c.multi) return Y(c.floors>=16 ? `다중이용건축물: 지상 ${c.floors}층 ≥ 16층` : `다중이용건축물: ${USES[c.use]} ≥ 5,000.00㎡`);
      return N('서울 경관조례 제24조 기준 미해당');
    }
    if (c.f.scenicZone) return Y('경관지구 내(입력) — 조례 요건 확인');
    if (c.f.scenicKey) return Q('중점경관관리구역 내(입력) — 경관계획이 정한 건축물인지 확인');
    return (c.multi || c.pub) ? Q(`${c.sido} 경관조례 기준 확인`) : N('일반적 기준 미만 — 조례 확인 권장');
  }},
 {id:'traffic', cat:'영향평가', name:'교통영향평가', law:'도시교통정비 촉진법 시행령 [별표1] (2024.2.6. 개정) · 서울시 교통영향평가에 관한 조례 [별표] (2024.3.26. 개정) · 도시교통정비 촉진법 제15조④ (법률 제21447호, 시행 2026.7.1., 확인 2026-11-05) 시·도 또는 인구 50만 이상 대도시 조례 위임 · 같은 법 시행령 제13조의2⑦1 별표 1에서 정한 규모의 100분의 50 이상 (대통령령 제36683호, 시행 2026.9.15., 확인 2026-11-05)', conf:'A',
  memo:'법령(도시교통정비지역): 공동주택 60,000㎡, 일반업무 25,000㎡, 숙박 40,000㎡, 상점 11,000㎡, 제2종 근생 15,000㎡, 문화집회 15,000㎡, 정비사업 부지 5만㎡. 서울 조례: 아파트 50,000㎡, 일반업무 20,000㎡, 숙박 20,000㎡, 상점 7,000㎡, 제2종 근생 8,000㎡, 문화집회 8,000㎡, 정비사업 부지 2.5만㎡(서울형 정비지원계획 5만㎡), 부설주차장 설치제한지역 3,000㎡ 이상(주택·오피스텔 제외). 복합용도: Σ(용도별 연면적÷기준)×10,000 ≥ 10,000. 서울 밖: 별표 1 기준으로 판정하며 시·도·50만 이상 대도시 조례 확인.',
  fn: c => {
    const S = c.isSeoul;
    const redevA = S ? TRAFFIC_REDEV.seoul : TRAFFIC_REDEV.nat;
    const tag = S ? '서울 조례: ' : '별표 1 기준 (시·도·50만 이상 대도시 조례 확인): ';
    if (c.type==='redev' && c.area>=redevA) return Y(`${tag}정비사업 부지면적 ${fA(c.area)} ≥ ${redevA.toLocaleString('ko-KR')}.00㎡`);
    const TH = S ? TRAFFIC_TH.seoul : TRAFFIC_TH.nat;
    if (c.use==='mixed') {
      const rg = c.gfa*c.resRatio/100, ng = c.gfa - rg;
      const swa = (rg/TH.apt + ng/TH.nonres) * 10000;
      const why = `${tag}복합용도 Swa = (주택 ${fA(rg)}÷${TH.apt.toLocaleString('ko-KR')} + 비주거 ${fA(ng)}÷${TH.nonres.toLocaleString('ko-KR')})×10,000 = ${f1(swa)}`;
      return swa>=10000 ? Y(why+' ≥ 10,000 (비주거는 제2종 근생 기준 가정)') : N(why+' < 10,000');
    }
    if (TH[c.use]) {
      const ok = c.gfa >= TH[c.use];
      const why = `${tag}${USES[c.use]} 연면적 ${fA(c.gfa)} ${ok?'≥':'<'} ${TH[c.use].toLocaleString('ko-KR')}.00㎡`;
      if (ok) return Y(why);
      if (S && c.use!=='officetel' && c.use!=='apt' && c.gfa>=3000) return Q(why+' — 부설주차장 설치제한지역이면 3,000㎡ 이상 대상(조례 제3조2호)');
      return N(why);
    }
    if (S && c.gfa>=3000) return Q(`${USES[c.use]} — 조례 별표 용도별 기준·부설주차장 설치제한지역 여부 확인`);
    const pre = S ? '' : tag;
    return c.gfa>=10000 ? Q(`${pre}${USES[c.use]} — 별표1 용도별 기준 확인`) : N(`${pre}용도별 기준 미만으로 추정 — 별표 확인 권장`);
  }},
 {id:'env', cat:'영향평가', name:'환경영향평가', law:'환경영향평가법 시행령 [별표3] · 서울시 환경영향평가 조례 [별표1] (2024.9.30. 개정) · 환경영향평가법 제42조 시·도 또는 인구 50만 이상 시 조례 위임 (법률 제21065호, 시행 2025.10.23., 확인 2026-11-05)', conf:'A',
  memo:'법령: 정비사업·주택건설사업 사업면적 30만㎡ 이상(서울 조례 상한으로 간접 확인). 서울 조례: 건축물 연면적 합계 10만㎡ 이상, 정비사업·주택건설사업(대지조성 포함) 사업면적 9만㎡ 이상 30만㎡ 미만. 조례 위임의 시행령 범위는 미확인.',
  fn: c => {
    if (c.area>=300000 && c.path!=='permit') return Y(`사업면적 ${fA(c.area)} ≥ 300,000.00㎡`);
    if (c.isSeoul) {
      if (c.gfa>=100000) return Y(`서울 조례: 연면적 ${fA(c.gfa)} ≥ 100,000.00㎡`);
      if (c.path!=='permit' && c.area>=90000) return Y(`서울 조례: ${c.path==='redev'?'정비사업':'주택건설사업'} 사업면적 ${fA(c.area)} ≥ 90,000.00㎡`);
      return N('서울 조례 기준 미만');
    }
    if (c.gfa>=100000 || c.area>=90000) return Q(`${c.sido} 환경영향평가 조례 확인`);
    return N('법령 기준(300,000.00㎡) 미만');
  }},
 {id:'senv', cat:'영향평가', name:'소규모 환경영향평가', law:'환경영향평가법 시행령 [별표4] (2025.10.1. 개정) [시행 2026.9.18.]', conf:'A',
  memo:'도시지역: 지구단위계획·기반시설 계획 등에 따라 시행하는 사업으로 사업계획 면적 6만㎡(녹지지역 1만㎡) 이상. 관리지역: 보전 5,000㎡, 생산 7,500㎡, 계획 10,000㎡. 농림지역 7,500㎡. 자연환경보전지역 5,000㎡.',
  fn: (c,V) => {
    if (V.env.s==='Y') return N('환경영향평가 대상');
    const NU = { mc:5000, mpr:7500, mp:10000, ag:7500, ne:5000 };
    if (!c.urban) { const t = NU[c.zone]; return c.area>=t ? Y(`${c.zoneName} 사업면적 ${fA(c.area)} ≥ ${t.toLocaleString('ko-KR')}.00㎡`) : N(`${c.zoneName} 사업면적 ${fA(c.area)} < ${t.toLocaleString('ko-KR')}.00㎡`); }
    const lim = c.green ? 10000 : 60000;
    if (c.area < lim) return N(`도시지역 사업면적 ${fA(c.area)} < ${lim.toLocaleString('ko-KR')}.00㎡`);
    if (c.f.dup || c.f.station) return Y(`지구단위계획에 따른 사업 ${fA(c.area)} ≥ ${lim.toLocaleString('ko-KR')}.00㎡`);
    return Q(`사업면적 ${fA(c.area)} ≥ ${lim.toLocaleString('ko-KR')}.00㎡ — 지구단위계획·기반시설 계획에 따른 사업인지 확인`);

    }

    if (positive(rv.basements)) { set.basements = String(rv.basements); bsmt = Math.max(bsmt, rv.basements); }
    if (positive(rv.height)) { set.height = String(rv.height); hgt = Math.max(hgt, rv.height); }
    if (positive(rv.offiHh)) { set.ofc = String(rv.offiHh); offi += rv.offiHh; }
    if (rv.kind === 'res') {
      if (positive(c.hh)) {
        const floors = rv.blds.reduce((m, b) => Math.max(m, b.floors), 0);
        if (positive(floors)) set.floors = String(floors);
        set.hh = String(c.hh);
        set.use = rv.retail > 0 ? 'mixed' : 'apt';
        if (set.use === 'mixed' &&
            typeof c.nonRes === 'number' && Number.isFinite(c.nonRes)) {
          const ratio = amount(100 - c.nonRes);
          if (ratio !== null) set.resRatio = ratio;
          if (positive(c.up)) { mixUp += c.up; mixRes += c.up * (100 - c.nonRes) / 100; }
        }
        hh += c.hh;
        top = Math.max(top, floors);
      }
    } else {
      const main = rv.uses.reduce(
        (best, u) => positive(u.pct) && (!best || u.pct > best.pct) ? u : best,
        null
      );
      if (main && Object.hasOwn(USES, main.use)) set.use = main.use;
    }
    return { pid:pc.id, name:c.name, set };
  });
  const proj = {};
  const gfa = totalKnown ? amount(total) : null;
  if (gfa !== null) proj.gfa = gfa;
  if (positive(hh)) proj.hh = String(hh);
  if (inp.use === 'officetel' && positive(offi)) proj.hh = String(offi);
  if (positive(top)) proj.floors = String(top);
  if (positive(bsmt)) proj.basements = String(bsmt);
  if (positive(hgt)) proj.height = String(hgt);
  const site = amount(z.site); if (site !== null) proj.site = site;
  const area = amount(parcelTotals(inp).total.sumC / 100); if (area !== null) proj.area = area;
  if (inp.use === 'mixed' && mixUp > 0) { const r = amount(mixRes / mixUp * 100); if (r !== null) proj.resRatio = r; }
  return { rows, proj };
}

function ovwApplyDiff(inp, plan) {
  const pcs = new Map(parcelsOf(inp).map(pc => [pc.id, pc]));
  const str = v => v === undefined || v === null ? '' : String(v);
  const changes = (src, set, fields) => fields
    .filter(fd => Object.hasOwn(set, fd) && str(src[fd]) !== str(set[fd]))
    .map(fd => ({ fd, from:str(src[fd]), to:str(set[fd]) }));
  const rows = [];
  for (const r of plan.rows) {
    const pc = pcs.get(r.pid);
    if (!pc) continue;
    const list = changes(pc, r.set,
      ['gfaUp', 'gfaDown', 'floors', 'basements', 'height', 'hh', 'ofc', 'use', 'resRatio']);
    if (list.length) rows.push({ pid:r.pid, name:r.name, changes:list });
  }
  return {
    rows,
    proj:changes(inp || {}, plan.proj, ['gfa', 'hh', 'floors', 'basements', 'height', 'site', 'area', 'resRatio'])
  };
}

// 개요 작성 값을 판정 입력에 채운다. 칸이 비었거나 마지막 자동 입력값 그대로일 때만 덮어쓰고,
// 직접 입력한 칸은 건드리지 않고 held로 돌려준다(force면 전부 덮어씀). 저장에는 target.auto만 늘어난다.
function ovwSyncTo(t, set, force) {
  const auto = { ...(t.auto || {}) }, applied = [], held = [];
  for (const fd of Object.keys(set)) {
    const cur = t[fd] == null ? '' : String(t[fd]), to = String(set[fd]);
    if (cur === to) continue;
    if (force || cur === '' || cur === auto[fd]) { t[fd] = to; auto[fd] = to; applied.push(fd); }
    else held.push({ fd, cur, to });
  }
  t.auto = auto;
  return { applied, held };
}
function ovwSync(inp, force) {
  const out = JSON.parse(JSON.stringify(inp));
  if (!parcelsOf(out).length) return { inp, applied:[], held:[] };
  const plan = ovwApplyPlan(out), byId = new Map(parcelsOf(out).map(pc => [pc.id, pc]));
  for (const r of plan.rows) { const pc = byId.get(r.pid); if (pc) ovwSyncTo(pc, r.set, force); }
  const r = ovwSyncTo(out, plan.proj, force);
  if (out.unk) { out.unk = { ...out.unk }; for (const fd of r.applied) delete out.unk[fd]; }
  return { inp:out, applied:r.applied, held:r.held };
}
function ovwApplyText(plan, diff) {
  const labels = {
    gfaUp:'지상 연면적', gfaDown:'지하 연면적',
    floors:'지상 최고층수', hh:'세대수', use:'주용도',
    resRatio:'주거 비율', gfa:'연면적 합계', basements:'지하층수', height:'최고높이',
    ofc:'오피스텔 실 수', site:'대지면적', area:'사업(구역)면적'
  };
  const value = (fd, v) => {
    if (v === '') return '미입력';
    if (fd === 'use') return Object.hasOwn(USES, v) ? USES[v] : v;
    const n = +v;
    if (!Number.isFinite(n)) return v;
    if (fd === 'floors' || fd === 'basements') return ovwFmt(n) + '층';
    if (fd === 'height') return ovwFmt(n, 1) + 'm';
    if (fd === 'ofc') return ovwFmt(n) + '실';
    if (fd === 'hh') return ovwFmt(n) + '세대';
    if (fd === 'resRatio') return ovwFmt(n, 2) + '%';
    return ovwFmt(n, 2) + '㎡';
  };
  const list = changes => changes.map(c =>
    labels[c.fd] + ' ' + value(c.fd, c.from) + ' → ' + value(c.fd, c.to)
  ).join(' · ');
  const lines = [
    '획지 ' + diff.rows.length
      + '개의 설계개요(지상·지하 연면적, 최고 층수, 세대수, 주용도)와 '
      + '프로젝트 규모(연면적 합계·세대수·지상 최고층수) 중 '
      + '아래 바뀌는 값만 판정 입력에 덮어씁니다.',
    '한도 칸은 건드리지 않습니다. 되돌리기(Ctrl+Z) 가능.'
  ];
  for (const r of diff.rows) lines.push(r.name + ': ' + list(r.changes));
  if (diff.proj.length) lines.push('프로젝트: ' + list(diff.proj));
  return lines.join(' / ');
}
// 엑셀 칸 종류별 모양 (승인된 샘플의 색). 머리·머리줄은 구역 색(sec)을 쓴다.
const OVW_KIND = { title:{ fill:'3F4E6E', color:'FFFFFF', bold:true, size:14, align:'left' }, note:{ fill:null, color:'5B6678', size:10, align:'left' },
  head:{ fill:'CFE0F7', color:'152033', bold:true, align:'left' }, th:{ fill:'EAF1FB', color:'152033', bold:true, align:'center' },
  label:{ fill:'F5F7FA', color:'152033', align:'left' }, input:{ fill:'FFF4CC', color:'1D4E9E', bold:true, align:'right' },
  calc:{ fill:'FFFFFF', color:'152033', align:'right' }, total:{ fill:'EDF1F6', color:'152033', bold:true, align:'right' }, text:{ fill:'FFFFFF', color:'152033', align:'left' } };
const OVW_SEC = { blue:['CFE0F7', 'EAF1FB'], sky:['C9E6F2', 'E6F4F9'], mint:['CDEBDD', 'E8F6EE'], peach:['FBD9C4', 'FDEEE3'], lav:['DDD6F3', 'F0ECFA'], rose:['F6D3DC', 'FBEBEF'], sand:['EFE3C2', 'F8F2E0'], slate:['DDE2EC', 'F1F3F7'] };
const OVW_FMT = { NUM:'#,##0.00', INT:'#,##0', PCT:'0.00%' };

function ovwColName(n) {
  if (!Number.isInteger(n) || n < 1 || n > 16384) return '';
  let out = '';
  while (n > 0) {
    n--;
    out = String.fromCharCode(65 + n % 26) + out;
    n = Math.floor(n / 26);
  }
  return out;
}

function ovwRefParse(ref) {
  if (typeof ref !== 'string') return null;
  const m = /^(\$?[A-Z]{1,3}\$?[1-9]\d*)(?::(\$?[A-Z]{1,3}\$?[1-9]\d*))?$/.exec(ref);
  if (!m) return null;
  const one = s => {
    const p = /^([A-Z]+)(\d+)$/.exec(s.replace(/\$/g, ''));
    let c = 0;
    for (const ch of p[1]) c = c * 26 + ch.charCodeAt(0) - 64;
    return { c, r:Number(p[2]) };
  };
  const a = one(m[1]);
  const b = one(m[2] || m[1]);
  if (a.c > b.c || a.r > b.r || b.c > 16384 || b.r > 1048576) return null;
  return { c1:a.c, r1:a.r, c2:b.c, r2:b.r };
}

function ovwSheetNames(names) {
  const used = new Set(['총괄', '주동타입', 'history']);
  return (Array.isArray(names) ? names : []).map(raw => {
    const clean = typeof raw === 'string'
      ? raw.replace(/[\\/?*\[\]:]/g, '').trim().replace(/^'+|'+$/g, '')
      : '';
    const base = clean || '획지';
    let name = base.slice(0, 31).replace(/'+$/g, '') || '획지';
    let n = 2;
    while (used.has(name.toLowerCase())) {
      const suffix = ' (' + n++ + ')';
      name = base.slice(0, 31 - suffix.length) + suffix;
    }
    used.add(name.toLowerCase());
    return name;
  });
}

function ovwSheetRef(name) {
  return "'" + String(name).replace(/'/g, "''") + "'!";
}

// 사용자 글자는 값으로만 받는다.
// 수식은 calc·total 종류와 여덟 번째 결과 인수를 명시한 호출만 허용한다.
function ovwPut(sheet, ref, v, kind = 'calc', fmt, sec, h, result) {
  const formula = (kind === 'calc' || kind === 'total') &&
    typeof v === 'string' && v.startsWith('=') &&
    arguments.length >= 8;
  const cell = { ref, kind };
  if (formula) {
    const finite = typeof result === 'number' && Number.isFinite(result);
    cell.f = v;
    cell.result = finite || typeof result === 'string' ? result : '입력 필요';
    if (!finite && typeof result !== 'string') {
      cell.f = '=IFERROR(' + v.slice(1) + ',"입력 필요")';
    }
  } else {
    cell.v = v === undefined ? null : v;
  }
  if (fmt) cell.fmt = fmt;
  if (sec) cell.sec = sec;
  const left = ['title', 'note', 'head', 'label', 'text'].includes(kind) ||
    (!formula && typeof v === 'string' && ['input', 'total'].includes(kind));
  cell.h = h || (kind === 'th' ? 'center' : left ? 'left' : 'right');
  sheet.cells.push(cell);
  return cell;
}

  return {

      c:i + 1, w:i === 0 ? 2 : 11
    })),
    rows:[{ r:2, h:30 }],

    verdict:[],
    print:{
      orientation:'landscape',

}

function ovwTypeLayout(inp) {
  const Z = reviewOf(inp);
  const n = Z.types.length;
  const typeRows = Object.create(null);
  Z.types.forEach((t, i) => { typeRows[t.id] = 6 + i; });
  const blocks = Object.create(null);
  let row = 8 + n;
  parcelsOf(inp).filter(pc => rvOf(pc).kind === 'res').forEach(pc => {
    const rv = rvOf(pc);
    const first = row + 3;
    const blank = first + rv.blds.length;
    const total = blank + 1;
    blocks[pc.id] = {
      title:row,
      group:row + 1,
      head:row + 2,
      first,
      blank,
      total,
      hhCols:Z.types.map((_, i) => ovwColName(5 + n + i)),
      mixCols:Z.types.map((_, i) => ovwColName(5 + i)),
      lastCol:5 + 2 * n
    };
    row = total + 3;
  });
  return {
    typeRows,
    blocks,
    lastCol:Math.max(13, 5 + 2 * n)
  };
}

  put('B2:' + last + '2', '주동 타입 — 공통 타입과 동별 세대수', 'title');

  ['타입', '전용면적(㎡)', '벽체공용(㎡)'].forEach((text, i) =>

  parcelsOf(inp).filter(pc => rvOf(pc).kind === 'res').forEach(pc => {

    put('B' + b.title + ':' + last + b.title, pc.name || '획지', 'text');
    if (n) {

      put('D' + r, bd
        ? Z.types.map(t => bd.mix[t.id] || 0).join(' / ')

      Z.types.forEach((t, k) => {

    Z.types.forEach((t, k) =>

        '=SUM(' + b.hhCols[k] + b.first + ':' + b.hhCols[k] + b.blank + ')',
        P.u[t.id], 'total'));
    calc(end + b.total,
      '=SUM(' + end + b.first + ':' + end + b.blank + ')',
      P.hh, 'total');
  });
  return sh;
}

  safeVerdict('H14:I14', '=IF(C14<=F14,"충족","미달")',

  safeVerdict('H17:I17', '=IF(C17<=F17,"충족","미달")',

  put('H18:I18', '법정 + 0.01%', 'text');
  put('H19:I19', '법정 + 0.01%', 'text');

  head('B23:I23', '■ 주차대수', 'peach');
  put('B24', '법정 (주거)', 'label');
  calc('C24', n
    ? '=ROUNDUP(SUMPRODUCT(D39:D' + (saleTotal - 1) +

  row(25, '법정 (판매)', null, 'calc', OVW_FMT.INT, '대',

  replaceCalc('C25', a.retailPk > 0

  row(26, '계획 주차', null, 'total', OVW_FMT.INT, '대',

    P.pk, 'total', OVW_FMT.INT);
  safeVerdict('H26:I26', '=IF(C26>=C24+C25,"충족","미달")',
    checks.pk.ok, 'C24');

  put('B27', '종류', 'th', undefined, 'peach');
  put('C27', '대수', 'th', undefined, 'peach');
  put('D27', '단위', 'th', undefined, 'peach');
  put('E27:G27', '기준 비율 · 규칙', 'th', undefined, 'peach');
  put('H27:I27', '실제 비율', 'th', undefined, 'peach');
  P.pkSplit.forEach((s, i) => {
    const r = 28 + i;
    const fs = [
      '=C26-SUM(C29:C32)',
      '=ROUNDUP(C26*F29,0)',
      '=ROUND(C26*F30,0)',
      '=ROUNDUP(C26*F31,0)',

    ];
    put('B' + r, s.name, 'label');
    calc('C' + r, fs[i], s.n, 'calc', OVW_FMT.INT);

    ['O6', '계획(㎡)'], ['P6:Q6', '판정']

  const band = (aa, b, c, d, e, f) =>
    '=IF(C20>=2000,' + aa + '+' + b + '*(C20-2000),IF(C20>=1500,' +

    '=10+(C20-50)*0.05',

  P.amen.forEach((s, i) => {

    if (s.key === 'play' && s.auto) {
      calc('O' + r, '=ROUNDUP(N11,0)', s.plan);
    } else {
      put('O' + r, s.plan, 'input', OVW_FMT.NUM);

    if (s.law === null) put('P' + r + ':Q' + r, '—');
    else calc('P' + r + ':Q' + r,

  put('L13:M13', '세대수 구간식 · 기준 확인 필요', 'total');

  calc('O13', '=SUM(O8:O12)', P.amenPlan, 'total');
  calc('P13:Q13', '=IF(O13>=N13,"충족","미달")',

  head('K15:Q15', '■ 용도별 면적표 (주거 / 비주거)', 'mint');
  [
    ['K16:M16', '구분'], ['N16', '주거'],
    ['O16', '비주거'], ['P16:Q16', '합계']
  ].forEach(([ref, text]) => put(ref, text, 'th', undefined, 'mint'));
  const areaRows = [
    ['전용면적', '=E' + total, '=N26*O26',
      P.ex, P.retailEx, 'calc'],
    ['공용면적', '=H' + total, '=N26*(1-O26)',
      P.wall + P.core, P.retailCom, 'calc'],
    ['공급면적 소계', '=N17+N18', '=O17+O18',
      P.supply, P.retail, 'total'],
    ['부대시설 (지상)', '=O7+O8+O9+O10+O12', '=0',
      P.amenUp, 0, 'calc'],
    ['기계/전기실 (지하)', null, null,
      P.mepRes, P.mepNon, 'input'],
    ['주차장 (지하)', '=(C26-C25)*C34', '=C25*C34',
      P.pkResArea, P.pkRetArea, 'calc'],
    ['합계', '=N19+N20+N21+N22', '=O19+O20+O21+O22',
      P.supply + P.amenUp + P.mepRes + P.pkResArea,
      P.retail + P.mepNon + P.pkRetArea, 'total']
  ];
  areaRows.forEach(([label, nf, of, nv, ov, kind], i) => {
    const r = 17 + i;
    put('K' + r + ':M' + r, label,
      kind === 'total' ? 'total' : 'label');
    if (kind === 'input') {
      put('N' + r, nv, 'input', OVW_FMT.NUM);
      put('O' + r, ov, 'input', OVW_FMT.NUM);
    } else {
      calc('N' + r, nf, nv, kind);
      calc('O' + r, of, ov, kind);
    }
    calc('P' + r + ':Q' + r, '=N' + r + '+O' + r,
      nv + ov, kind === 'total' ? 'total' : 'calc');
  });
  head('K25:Q25', '■ 비주거시설', 'sand');
  put('K26:M26', '판매시설 공급면적 (지상)', 'label');
  put('N26', P.retail, 'input', OVW_FMT.NUM);
  put('O26', a.retailEx / 100, 'input', OVW_FMT.PCT);
  put('P26:Q26', '← 전용률', 'text');

  head('B36:Q36', '■ 공동주택 분양면적표', 'sky');
  [
    ['B37:D37', ''], ['E37', '전용'], ['F37:H37', '공용면적'],
    ['I37', '공급'], ['J37:L37', '기타공용면적'],
    ['M37', '주차장'], ['N37', '계약'], ['O37:Q37', '비율 · 주차']
  ].forEach(([ref, text]) => put(ref, text, 'th', undefined, 'sky'));
  [
    '구분', '타입', '세대수', '전용면적', '벽체공용', '코어', '소계',
    '공급면적', '부대시설', '기전실', '소계', '주차장', '계약면적',
    '세대비율', '전용률', '법정주차(대/세대)'
  ].forEach((text, i) =>
    put(ovwColName(i + 2) + '38', text, 'th', undefined, 'sky'));

  ['sale', 'rent', 'pub'].forEach((group, gi) => {
    Z.types.forEach((t, i) => {
      const r = [saleFirst, rentFirst, pubFirst][gi] + i;
      const source = saleFirst + i;
      const data = P.rows.find(x => x.grp === group && x.tid === t.id);
      units.push({ r, data });
      put('B' + r, ['분양', '의무임대', '공공주택'][gi], 'label');
      put('C' + r, t.name, 'text', undefined, undefined, 'center');
      if (gi === 0) {
        calc('D' + r, '=' + ovwSheetRef('주동타입') +
          T.blocks[pid].hhCols[i] + T.blocks[pid].total +
          '-D' + (rentFirst + i) + '-D' + (pubFirst + i),
          data.hh, 'calc', OVW_FMT.INT);
        calc('E' + r,
          '=' + ovwSheetRef('주동타입') + 'C' + tr[t.id], data.ex);
        calc('F' + r,
          '=' + ovwSheetRef('주동타입') + 'D' + tr[t.id], data.wall);
      } else {
        put('D' + r, data.hh, 'input', OVW_FMT.INT);
        calc('E' + r, '=E' + source, data.ex);
        calc('F' + r, '=F' + source, data.wall);
      }
      const fs = [
        '=E' + r + '*$F$34',
        '=F' + r + '+G' + r,
        '=E' + r + '+H' + r,
        '=$N$20/$E$' + total + '*E' + r,
        '=$N$21/$E$' + total + '*E' + r,
        '=J' + r + '+K' + r,
        '=$N$22/$E$' + total + '*E' + r,
        '=I' + r + '+L' + r + '+M' + r,
        '=D' + r + '/$D$' + total,
        '=E' + r + '/I' + r,
        '=MAX(E' + r + '/IF(E' + r + '<=85,75,65),IF(E' +
          r + '<=60,0.7,1))'
      ];
      const values = [
        data.core, data.common, data.supply, data.etcUp, data.etcMep,
        data.etcSum, data.pkArea, data.contract, data.ratio,
        data.exRate, data.pkPerHh
      ];
      [...'GHIJKLMNOPQ'].forEach((col, k) =>
        calc(col + r, fs[k], values[k], 'calc',
          ['O', 'P'].includes(col) ? OVW_FMT.PCT : OVW_FMT.NUM));
    });
  });

  const field = {
    E:'ex', F:'wall', G:'core', H:'common', I:'supply',
    J:'etcUp', K:'etcMep', L:'etcSum', M:'pkArea', N:'contract'
  };
  const weighted = (rows, key) => {
    let sum = 0;
    for (const u of rows) {
      if (typeof u.data[key] !== 'number' ||
        !Number.isFinite(u.data[key])) return null;
      sum += u.data.hh * u.data[key];
    }
    return sum;
  };
  const subtotal = (r, label, first, last) => {
    const rows = units.filter(u => u.r >= first && u.r <= last);
    const hh = rows.reduce((s, u) => s + u.data.hh, 0);
    put('B' + r + ':C' + r, label, 'total');
    calc('D' + r, sumRange('D', first, last),
      hh, 'total', OVW_FMT.INT);
    for (const col of 'EFGHIJKLMN') {
      calc(col + r, productRange(col, first, last),
        weighted(rows, field[col]), 'total');
    }
    calc('O' + r, '=D' + r + '/$D$' + total,
      div(hh, P.hh), 'total', OVW_FMT.PCT);
    calc('P' + r, '=E' + r + '/I' + r,
      div(weighted(rows, 'ex'), weighted(rows, 'supply')),
      'total', OVW_FMT.PCT);
    put('Q' + r, null, 'total');

  subtotal(saleTotal, '소계 (분양)', saleFirst, saleTotal - 1);
  subtotal(rentTotal, '소계 (임대)', rentFirst, rentTotal - 1);

  put('B' + total + ':C' + total, '공동주택 합계', 'total');
  calc('D' + total, '=D' + saleTotal + '+D' + rentTotal,
    P.hh, 'total', OVW_FMT.INT);
  const totals = {
    E:P.ex, F:P.wall, G:P.core, H:P.wall + P.core, I:P.supply,
    J:P.amenUp, K:P.mepRes, L:P.amenUp + P.mepRes,
    M:P.pkResArea, N:P.contract
  };
  for (const col of 'EFGHIJKLMN') {
    let f = '=' + col + saleTotal + '+' + col + rentTotal;
    if (P.ex === 0 && 'JKLMN'.includes(col)) {
      const direct = {
        J:'=N20',
        K:'=N21',
        L:'=J' + total + '+K' + total,
        M:'=N22',
        N:'=I' + total + '+L' + total + '+M' + total
      };
      f = direct[col];
    }
    calc(col + total, f, totals[col], 'total');
  }
  calc('O' + total, '=O' + saleTotal + '+O' + rentTotal,
    P.hh > 0 ? 1 : null, 'total', OVW_FMT.PCT);
  calc('P' + total, '=E' + total + '/I' + total,
    div(P.ex, P.supply), 'total', OVW_FMT.PCT);
  put('Q' + total, null, 'total');

  head('B' + verdictHead + ':I' + verdictHead, '■ 판정', 'rose');
  const header = verdictHead + 1;
  [
    ['B', '', '항목'], ['C', ':E', '기준'], ['F', '', '기준값'],
    ['G', '', '계획'], ['H', ':I', '판정']
  ].forEach(([col, span, text]) =>
    put(col + header + (span ? span + header : ''),
      text, 'th', undefined, 'rose'));
  const definitions = [
    ['far', '용적률', '한도 이하 (고시)', '=F14',
      P.lim.far ? P.lim.far.v / 100 : null,
      '=C14', pct(P.far), '<=', OVW_FMT.PCT],
    ['bcr', '건폐율', '한도 이하 (법령)', '=F17',
      P.lim.bcr ? P.lim.bcr.v / 100 : null,
      '=C17', pct(P.bcr), '<=', OVW_FMT.PCT],
    ['pk', '주차', '법정 대수 이상', '=C24+C25',
      P.pkLaw, '=C26', P.pk, '>=', OVW_FMT.INT],
    ['nonres', '비주거 비율', '고시 기준 이상 · 확인 필요', null,
      Z.std.nonResMin / 100, '=F21', pct(P.nonRes), '>=', OVW_FMT.PCT],
    ['comm', '주민공동시설 총량', '법정 총량 이상 · 확인 필요',
      '=N13', P.amenLaw, '=O13', P.amenPlan, '>=', OVW_FMT.NUM],
    ['pub', '공공주택 공급면적', '대지 × 완화 용적률의 50% 이상',
      '=C10*F15/2', P.pubNeed,
      n ? '=SUMPRODUCT(D' + pubFirst + ':D' + (rentTotal - 1) +
        ',I' + pubFirst + ':I' + (rentTotal - 1) + ')' : '=0',
      P.pubPlan, '>=', OVW_FMT.NUM]
  ];
  definitions.forEach(([id, label, rule, f, limit, plan, value, op, fmt], i) => {
    const r = verdictFirst + i;
    put('B' + r, label, 'label');
    put('C' + r + ':E' + r, rule, 'text');
    if (f) {
      const missing = limit === null && ['far', 'bcr'].includes(id);
      calc('F' + r, missing
        ? '=IF(' + f.slice(1) + '="","",' + f.slice(1) + ')'
        : f, missing ? '' : limit, 'calc', fmt);
    } else {
      put('F' + r, limit, 'input', fmt);
    }
    calc('G' + r, plan, value, 'calc', fmt);
    safeVerdict('H' + r + ':I' + r,
      '=IF(G' + r + op + 'F' + r + ',"충족","미달")',
      checks[id].ok, 'F' + r);
  });
  const nonresRow = verdictFirst + 3;
  safeVerdict('H21:I21',
    '=IF(F21>=F' + nonresRow + ',"충족","미달")',
    checks.nonres.ok, 'F' + nonresRow);
  put('B' + bottom + ':Q' + bottom,
    '※ 검토용 개요입니다. 기준·법령 확인과 실제 엑셀 재계산 확인은 별도입니다. 구역 합산 판정은 총괄 시트 단계에서 제공합니다.',
    'note');

  const widths = [2, 19, 13, 9, 16, 12, 9, 10, 12, 11, 20, 12, 12, 13, 13, 10, 13];
  sh.cols = widths.map((w, i) => ({ c:i + 1, w }));
  sh.rows = [{ r:2, h:32 }];
  for (let r = 5; r <= bottom; r++) {
    sh.rows.push({
      r, h:[5, 15, 23, 25, 36, verdictHead].includes(r) ? 23 : 19
    });
  }
  sh.verdict = [
    'H14:I21', 'H26:I26', 'P7:Q13',
    'H' + verdictFirst + ':I' + (verdictFirst + 5)
  ];
  return sh;
}

function ovwNonSheet(inp, pid, names) {
  const pcs = parcelsOf(inp);
  const pc = pcs.find(p => p.id === pid);
  if (!pc || rvOf(pc).kind !== 'non') return null;
  const Z = reviewOf(inp);
  const rv = rvOf(pc);
  const P = ovwParcel(Z, pc);
  const a = Z.asm;
  const resolved = Array.isArray(names)
    ? names : ovwSheetNames(pcs.map(p => p.name));
  const sh = ovwNewSheet(resolved[pcs.indexOf(pc)]);
  const checks = Object.fromEntries(P.checks.map(c => [c.id, c]));
  const useFirst = 7;
  const useTotal = useFirst + P.uses.length;
  const verdictHead = Math.max(12, useTotal + 3);
  const verdictFirst = verdictHead + 2;
  const bottom = Math.max(38, verdictFirst + 6);
  const pct = v => typeof v === 'number' ? v / 100 : null;
  const div = (x, y) =>
    typeof x === 'number' && Number.isFinite(x) &&
    typeof y === 'number' && Number.isFinite(y) && y > 0
      ? x / y : null;
  const word = ok => ok === null || ok === undefined
    ? '입력 필요' : ok ? '충족' : '미달';
  const put = (ref, value, kind = 'calc', fmt, sec, h) =>
    ovwPut(sh, ref, value, kind, fmt, sec, h);
  const calc = (ref, formula, result, kind = 'calc', fmt = OVW_FMT.NUM) =>
    ovwPut(sh, ref, formula, kind, fmt, undefined, undefined, result);
  const head = (ref, text, sec) =>
    put(ref, text, 'head', undefined, sec);
  const verdict = (ref, condition, ready, ok) =>
    calc(ref,
      '=IFERROR(IF(' + ready + ',IF(' + condition +
      ',"충족","미달"),"입력 필요"),"입력 필요")',
      word(ok), 'calc', null);
  const valueRow = (r, label, formula, result, kind = 'calc',
    fmt = OVW_FMT.NUM, unit = '㎡') => {
    put('B' + r, label, 'label');
    calc('C' + r, formula, result, kind, fmt);
    put('D' + r, unit, 'text');
  };
  const inputRow = (r, label, value, fmt = OVW_FMT.NUM, unit = '㎡') => {
    put('B' + r, label, 'label');
    put('C' + r, value, 'input', fmt);
    put('D' + r, unit, 'text');
  };
  const sideInput = (r, label, value, fmt = OVW_FMT.NUM, unit = '') => {
    put('E' + r, label, 'label');
    put('F' + r, value, 'input', fmt);
    put('G' + r, unit, 'text');
  };
  const project = ovwStr(inp && inp.name);
  const zone = ZONES.find(z => z[0] === pc.zone);

  put('B2:Q2',
    project + ' 정비계획 — 검토 개요 · 비주거 획지 ' + ovwStr(pc.name),
    'title');
  put('B3:Q3',
    '노란 칸 = 입력 · 나머지 = 수식 · 기준 출처와 법령은 별도 확인',
    'note');
  head('B5:I5', '■ 설계개요', 'blue');
  [
    ['사 업 명', project],
    ['대지위치', [
      ovwStr(inp && inp.sido),
      ovwStr(inp && inp.sgg),
      ovwStr(pc.name)
    ].filter(Boolean).join(' ')],
    ['지역 / 지구', zone ? zone[1] : ''],
    ['용      도', rv.uses.map(u => u.name).join(', ')]
  ].forEach(([label, value], i) => {
    const r = 6 + i;
    put('B' + r, label, 'label');
    put('C' + r + ':I' + r, value, 'text');
  });

  inputRow(10, '대지면적', P.site);
  valueRow(11, '지상 연면적', '=C10*C15', P.up);
  valueRow(12, '지하 연면적', '=C26*C34+C35', P.dn);
  valueRow(13, '전체 연면적', '=C11+C12', P.total, 'total');
  valueRow(14, '용 적 률', '=C11/C10', pct(P.far),
    'total', OVW_FMT.PCT, '');
  inputRow(15, '계획 용적률', rv.farPlan / 100, OVW_FMT.PCT, '');
  inputRow(16, '건축면적', rv.bld);
  valueRow(17, '건 폐 율', '=C16/C10', pct(P.bcr),
    'total', OVW_FMT.PCT, '');
  valueRow(18, '조경면적', '=C10*(F18+0.0001)', P.land);
  valueRow(19, '공개공지', '=C10*(F19+0.0001)', P.open);

  [[10, P.site], [11, P.up], [12, P.dn], [13, P.total], [16, rv.bld]]
    .forEach(([r, value]) => {
      put('E' + r, '평 환산', 'label');
      calc('F' + r, '=C' + r + '*0.3025',
        value === null ? null : value * 0.3025);
      put('G' + r, '평', 'text');
    });
  sideInput(14, '용적률 한도', P.lim.far ? P.lim.far.v / 100 : null,
    OVW_FMT.PCT);
  sideInput(17, '건폐율 한도', P.lim.bcr ? P.lim.bcr.v / 100 : null,
    OVW_FMT.PCT);
  sideInput(18, '법정 비율', a.landLaw / 100, OVW_FMT.PCT);
  sideInput(19, '법정 비율', a.openLaw / 100, OVW_FMT.PCT);
  put('H18:I18', '법정 + 0.01%', 'text');
  put('H19:I19', '법정 + 0.01%', 'text');
  verdict('H14:I14', 'C14<=F14',
    'AND(C10>0,C15>0,ISNUMBER(F14))', checks.far.ok);
  verdict('H17:I17', 'C17<=F17',
    'AND(C10>0,ISNUMBER(F17))', checks.bcr.ok);

  head('B23:I23', '■ 주차대수', 'peach');
  valueRow(24, '법정 주차',
    '=IF(F24>0,ROUND(C11/F24,0),"입력 필요")',
    P.pkLaw, 'calc', OVW_FMT.INT, '대');
  sideInput(24, '면적당 1대', rv.pkPer, OVW_FMT.NUM, '㎡');
  valueRow(26, '계획 주차', '=C24', P.pk,
    'total', OVW_FMT.INT, '대');
  verdict('H26:I26', 'C26>=C24',
    'AND(C10>0,C15>0,F24>0,ISNUMBER(C24),ISNUMBER(C26))',
    checks.pk.ok);

  [
    ['B27', '종류'],
    ['C27', '대수'],
    ['D27', '단위'],
    ['E27:G27', '기준 비율 · 규칙'],
    ['H27:I27', '실제 비율']
  ].forEach(([ref, text]) => put(ref, text, 'th', undefined, 'peach'));
  const split = P.pkSplit.length ? P.pkSplit : ovwSplitPk(0, a);
  split.forEach((part, i) => {
    const r = 28 + i;
    const formulas = [
      '=C26-SUM(C29:C32)',
      '=ROUNDUP(C26*F29,0)',
      '=ROUND(C26*F30,0)',
      '=ROUNDUP(C26*F31,0)',
      '=ROUNDUP(C26*F32,0)'
    ];
    const value = P.pk === null ? null : part.n;
    put('B' + r, part.name, 'label');
    calc('C' + r, formulas[i], value, 'calc', OVW_FMT.INT);
    put('D' + r, '대', 'text');
    put('E' + r, part.rule, 'text');
    put('F' + r, pct(part.ratio),
      part.ratio === null ? 'calc' : 'input', OVW_FMT.PCT);
    put('G' + r, null);
    calc('H' + r + ':I' + r, '=C' + r + '/$C$33',
      div(value, P.pk), 'calc', OVW_FMT.PCT);
  });
  put('B33', '계', 'total');
  calc('C33', '=IF(ISNUMBER(C26),SUM(C28:C32),"입력 필요")',
    P.pk, 'total', OVW_FMT.INT);
  put('D33', '대', 'total');
  put('E33:G33', null, 'total');
  calc('H33:I33',
    '=IF(AND(ISNUMBER(C33),C33>0),SUM(H28:H32),"입력 필요")',
    P.pk > 0 ? 1 : null, 'total', OVW_FMT.PCT);
  inputRow(34, '주차장 면적', a.pkArea, OVW_FMT.NUM, '㎡/대');
  inputRow(35, '기전실', rv.mepNon);

  head('K5:Q5', '■ 용도별 면적표', 'mint');
  [
    ['K6:M6', '용도'],
    ['N6', '구성비'],
    ['O6', '면적(㎡)'],
    ['P6:Q6', '평 환산']
  ].forEach(([ref, text]) => put(ref, text, 'th', undefined, 'mint'));
  P.uses.forEach((use, i) => {
    const r = useFirst + i;
    put('K' + r + ':M' + r, use.name, 'text');
    put('N' + r, use.pct / 100, 'input', OVW_FMT.PCT);
    calc('O' + r, '=$C$11*N' + r, use.area);
    calc('P' + r + ':Q' + r, '=O' + r + '*0.3025',
      use.area * 0.3025);
  });
  put('K' + useTotal + ':M' + useTotal, '합계 · 구성비 판정', 'total');
  calc('N' + useTotal, P.uses.length
    ? '=SUM(N' + useFirst + ':N' + (useTotal - 1) + ')' : '=0',
    P.mixSum / 100, 'total', OVW_FMT.PCT);
  calc('O' + useTotal, P.uses.length
    ? '=SUM(O' + useFirst + ':O' + (useTotal - 1) + ')' : '=0',
    ovwSumFinite(P.uses.map(use => use.area)), 'total');
  calc('P' + useTotal + ':Q' + useTotal,
    '=IF(ABS(N' + useTotal + '-1)<0.0005,"충족","미달")',
    word(checks.mix.ok), 'total', null);

  head('K' + verdictHead + ':Q' + verdictHead, '■ 판정', 'rose');
  const header = verdictHead + 1;
  [
    ['K', '', '항목'],
    ['L', '', '기준'],
    ['M', '', '기준값'],
    ['N', '', '계획'],
    ['O', ':Q', '판정']
  ].forEach(([col, span, text]) => {
    put(col + header + (span ? span + header : ''),
      text, 'th', undefined, 'rose');
  });
  const definitions = [
    ['far', '용적률', '한도 이하', '=F14',
      P.lim.far ? P.lim.far.v / 100 : null,
      '=C14', pct(P.far), 'N{r}<=M{r}',
      'AND(C10>0,C15>0,ISNUMBER(F14))', OVW_FMT.PCT],
    ['bcr', '건폐율', '한도 이하', '=F17',
      P.lim.bcr ? P.lim.bcr.v / 100 : null,
      '=C17', pct(P.bcr), 'N{r}<=M{r}',
      'AND(C10>0,ISNUMBER(F17))', OVW_FMT.PCT],
    ['pk', '주차', '법정 이상', '=C24', P.pkLaw,
      '=C26', P.pk, 'N{r}>=M{r}',
      'AND(C10>0,C15>0,F24>0,ISNUMBER(C24),ISNUMBER(C26))',
      OVW_FMT.INT],
    ['mix', '용도 구성비 합', '100%', '=1', 1,
      '=N' + useTotal, P.mixSum / 100,
      'ABS(N{r}-M{r})<0.0005', 'TRUE', OVW_FMT.PCT]
  ];
  definitions.forEach(([
    id, label, rule, criterion, limit, plan, value, condition, ready, fmt
  ], i) => {
    const r = verdictFirst + i;
    put('K' + r, label, 'label');
    put('L' + r, rule, 'text');
    const missingLimit = ['far', 'bcr'].includes(id) && limit === null;
    calc('M' + r, missingLimit
      ? '=IF(' + criterion.slice(1) + '="","",' +
        criterion.slice(1) + ')'
      : criterion, missingLimit ? '' : limit, 'calc', fmt);
    calc('N' + r, plan, value, 'calc', fmt);
    verdict('O' + r + ':Q' + r,
      condition.replace(/\{r\}/g, String(r)), ready, checks[id].ok);
  });
  put('B' + bottom + ':Q' + bottom,
    '※ 검토용 개요입니다. 기준 출처·법령 및 실제 엑셀 재계산 확인은 별도입니다.',
    'note');

  const widths = [
    2, 19, 13, 9, 16, 12, 9, 10, 12, 11, 20, 12, 12, 13, 13, 10, 13
  ];
  sh.cols = widths.map((w, i) => ({ c:i + 1, w }));
  sh.rows = [{ r:2, h:32 }];
  for (let r = 5; r <= bottom; r++) {
    sh.rows.push({
      r,
      h:[5, 23, verdictHead].includes(r) ? 23 : 19
    });
  }
  sh.verdict = [
    'H14:I14',
    'H17:I17',
    'H26:I26',
    'P' + useTotal + ':Q' + useTotal,
    'O' + verdictFirst + ':Q' + (verdictFirst + 3)
  ];
  return sh;
}

function ovwSummaryRefs(names) {
  const count = Array.isArray(names) ? names.length : 0;
  const stdFirst = 30 + count * 3;
  const keys = [
    'small', 'rentMin', 'rentMax', 'rentArea',
    'nonShare', 'r40min', 'r40max', 'nonResMin'
  ];
  const std = {};
  const stdRef = {};
  keys.forEach((key, i) => {
    std[key] = 'F' + (stdFirst + i);
    stdRef[key] = ovwSheetRef('총괄') + std[key];
  });
  return {
    name:'총괄',
    summaryFirst:7,
    summaryTotal:7 + count,
    zoneHead:10 + count,
    zoneFirst:12 + count,
    rentHead:18 + count,
    rentFirst:20 + count,
    rentTotal:20 + count * 2,
    pubHead:23 + count * 2,
    pubFirst:25 + count * 2,
    stdHead:28 + count * 3,
    stdFirst,
    sourceHead:40 + count * 3,
    sourceFirst:42 + count * 3,
    std,
    stdRef
  };
}

function ovwSummarySheet(inp, names, refs) {
  const pcs = parcelsOf(inp);
  const resolved = Array.isArray(names)
    ? names : ovwSheetNames(pcs.map(pc => pc.name));
  const R = refs || ovwSummaryRefs(resolved);
  const zone = ovwZone(inp);
  const Z = zone.Z;
  const n = Z.types.length;
  const sh = ovwNewSheet(R.name);
  const saleFirst = 39;
  const saleTotal = saleFirst + n;
  const rentFirst = saleTotal + 1;
  const pubFirst = rentFirst + n;
  const rentTotal = pubFirst + n;
  const total = rentTotal + 1;
  const verdictFirst = total + 4;
  const finite = value =>
    typeof value === 'number' && Number.isFinite(value);
  const pct = value => finite(value) ? value / 100 : null;
  const div = (a, b) =>
    finite(a) && finite(b) && b > 0 ? a / b : null;
  const word = ok => ok === null || ok === undefined
    ? '입력 필요' : ok ? '충족' : '미달';
  const put = (ref, value, kind = 'calc', fmt, sec, h) =>
    ovwPut(sh, ref, value, kind, fmt, sec, h);
  const calc = (ref, expression, result,
    kind = 'calc', fmt = OVW_FMT.NUM) =>
    ovwPut(
      sh, ref,
      '=IFERROR(' + expression + ',"입력 필요")',
      kind, fmt, undefined, undefined, result
    );
  const head = (row, text, sec) =>
    put('B' + row + ':Q' + row, text, 'head', undefined, sec);
  const header = (row, definitions, sec) =>
    definitions.forEach(([span, text]) => {
      const ends = span.split(':');
      const ref = ends[0] + row +
        (ends.length === 2 ? ':' + ends[1] + row : '');
      put(ref, text, 'th', undefined, sec);
    });
  const sum = expressions => {
    if (!expressions.length) return '0';
    const joined = expressions.join(',');
    return 'IF(COUNT(' + joined + ')=' + expressions.length +
      ',SUM(' + joined + '),"입력 필요")';
  };
  const sumRows = (col, first, last) =>
    first <= last
      ? sum(Array.from(
        { length:last - first + 1 },
        (_, i) => col + (first + i)
      ))
      : '0';
  const weighted = (quote, first, last, column) => {
    if (first > last) return '0';
    const ready = Array.from(
      { length:last - first + 1 },
      (_, i) => {
        const row = first + i;
        return 'OR(' + quote + 'D' + row + '=0,ISNUMBER(' +
          quote + column + row + '))';
      }
    ).join(',');
    return 'IF(AND(' + ready + '),SUMPRODUCT(' +
      quote + 'D' + first + ':D' + last + ',' +
      quote + column + first + ':' + column + last +
      '),"입력 필요")';
  };
  const statusExpression = (no, need) =>
    'IF(' + no + '>0,"미달 "&' + no +
    ',IF(' + need + '>0,"입력 필요","충족"))';
  const items = pcs.map((pc, i) => {
    const P = zone.C[i];
    const residential = P.kind === 'res';
    const quote = ovwSheetRef(resolved[i]);
    const first = residential
      ? verdictFirst
      : Math.max(12, 7 + rvOf(pc).uses.length + 3) + 2;
    const last = first + (residential ? 5 : 3);
    const col = residential ? 'H' : 'O';
    const checkRange = quote + col + first + ':' + col + last;
    return {
      pc, P, residential, quote,
      no:'COUNTIF(' + checkRange + ',"미달")',
      need:'COUNTIF(' + checkRange + ',"입력 필요")'
    };
  });
  const residential = items.filter(item => item.residential);
  const zoneChecks = Object.fromEntries(
    zone.checks.map(check => [check.id, check])
  );
  const parcelChecks = items.flatMap(item => item.P.checks);
  const tally = ovwTally(parcelChecks);
  const statusValue = value => value.no
    ? '미달 ' + value.no
    : value.need ? '입력 필요' : '충족';

  put('B2:Q2',
    ovwStr(inp && inp.name) + ' 정비계획 — 검토 개요 · 구역 총괄',
    'title');
  put('B3:Q3',
    '노란 칸 = 고시 기준 입력 · 획지 값은 각 시트 참조 · 기준 출처와 실제 엑셀 재계산은 별도 확인',
    'note');

  head(5, '■ 획지별 요약', 'blue');
  header(6, [
    ['B', '획지'], ['C', '구성'], ['D', '대지(㎡)'],
    ['E', '용적률'], ['F', '용적률 한도'],
    ['G', '건폐율'], ['H', '건폐율 한도'],
    ['I', '지상(㎡)'], ['J', '지하(㎡)'],
    ['K', '세대'], ['L', '임대 세대'],
    ['M', '주차'], ['N:Q', '획지 판정']
  ], 'blue');

  items.forEach((item, i) => {
    const { pc, P, quote, residential:res } = item;
    const row = R.summaryFirst + i;
    const one = ovwTally(P.checks);
    put('B' + row, ovwStr(pc.name), 'text');
    put('C' + row, res ? '주거 + 판매' : '비주거', 'text');
    [
      ['D', 'C10', P.site, OVW_FMT.NUM],
      ['E', 'C14', pct(P.far), OVW_FMT.PCT],
      ['G', 'C17', pct(P.bcr), OVW_FMT.PCT],
      ['I', 'C11', P.up, OVW_FMT.NUM],
      ['J', 'C12', P.dn, OVW_FMT.NUM],
      ['M', 'C26', P.pk, OVW_FMT.INT]
    ].forEach(([col, source, value, fmt]) =>
      calc(col + row, quote + source, value, 'calc', fmt));
    [
      ['F', 'F14', P.lim.far],
      ['H', 'F17', P.lim.bcr]
    ].forEach(([col, source, limit]) =>
      calc(col + row,
        'IF(ISNUMBER(' + quote + source + '),' +
        quote + source + ',"입력 필요")',
        limit ? limit.v / 100 : '입력 필요',
        'calc', OVW_FMT.PCT));
    calc('K' + row, res ? quote + 'C20' : '0',
      P.hh, 'calc', OVW_FMT.INT);
    calc('L' + row, res ? quote + 'F20' : '0',
      res ? P.rentHh + P.pubHh : 0, 'calc', OVW_FMT.INT);
    calc('N' + row + ':Q' + row,
      statusExpression(item.no, item.need),
      statusValue(one), 'calc', null);
  });

  const sr = R.summaryTotal;
  put('B' + sr + ':C' + sr, '구역 합계', 'total');
  [
    ['D', zone.site, OVW_FMT.NUM],
    ['I', zone.up, OVW_FMT.NUM],
    ['J', zone.dn, OVW_FMT.NUM],
    ['K', zone.hh, OVW_FMT.INT],
    ['L', zone.allRent, OVW_FMT.INT],
    ['M', zone.pk, OVW_FMT.INT]
  ].forEach(([col, value, fmt]) =>
    calc(col + sr,
      sumRows(col, R.summaryFirst, sr - 1),
      value, 'total', fmt));
  calc('E' + sr, 'IF(D' + sr + '>0,I' + sr +
    '/D' + sr + ',"입력 필요")',
    div(zone.up, zone.site), 'total', OVW_FMT.PCT);
  put('F' + sr, '', 'total');
  calc('G' + sr, 'IF(D' + sr + '>0,(' +
    sum(items.map(item => item.quote + 'C16')) +
    ')/D' + sr + ',"입력 필요")',
    div(ovwSumFinite(pcs.map(pc => rvOf(pc).bld)), zone.site),
    'total', OVW_FMT.PCT);
  put('H' + sr, '', 'total');
  calc('N' + sr + ':Q' + sr,
    statusExpression(
      sum(items.map(item => item.no)),
      sum(items.map(item => item.need))
    ),
    statusValue(tally), 'total', null);

  head(R.zoneHead, '■ 구역 합산 판정', 'rose');
  header(R.zoneHead + 1, [
    ['B:E', '항목'], ['F', '하한 · 필요'],
    ['G', '상한'], ['H:J', '계획'], ['K:Q', '판정']
  ], 'rose');

  const smallTerms = residential.flatMap(item => n ? [
    'SUMIF(' + item.quote + 'E39:E' + (saleTotal - 1) +
      ',"<=85",' + item.quote + 'D39:D' + (saleTotal - 1) + ')',
    'SUMIF(' + item.quote + 'E' + rentFirst + ':E' +
      (rentTotal - 1) + ',"<=85",' + item.quote + 'D' +
      rentFirst + ':D' + (rentTotal - 1) + ')'
  ] : []);
  const fortyTerms = residential.map(item => n
    ? 'SUMIF(' + item.quote + 'E' + rentFirst + ':E' +
      (rentTotal - 1) + ',"<=40",' + item.quote + 'D' +
      rentFirst + ':D' + (rentTotal - 1) + ')'
    : '0');
  const ratio = (numerator, denominator) =>
    'IF(AND(ISNUMBER(' + denominator + '),' +
    denominator + '>0),(' + numerator + ')/' +
    denominator + ',"입력 필요")';
  const definitions = [
    {
      id:'small', label:'85㎡ 이하 세대 비율',
      lower:R.std.small, lowerValue:Z.std.small / 100,
      upper:null, upperValue:null,
      expression:ratio(sum(smallTerms), 'K' + sr),
      value:div(zone.small, zone.hh), fmt:OVW_FMT.PCT
    },
    {
      id:'rent', label:'임대 세대 비율',
      lower:R.std.rentMin, lowerValue:Z.std.rentMin / 100,
      upper:R.std.rentMax, upperValue:Z.std.rentMax / 100,
      expression:ratio('L' + sr, 'K' + sr),
      value:div(zone.allRent, zone.hh), fmt:OVW_FMT.PCT
    },
    {

function ovwLayout(inp) {
  const pcs = parcelsOf(inp);
  if (!pcs.length) return { sheets:[] };
  const names = ovwSheetNames(pcs.map(pc => pc.name));
  const refs = ovwSummaryRefs(names);
  const T = ovwTypeLayout(inp);
  const parcelSheets = pcs.map(pc => rvOf(pc).kind === 'res'
    ? ovwParcelSheet(inp, pc.id, names, T.typeRows)
    : ovwNonSheet(inp, pc.id, names));
  // 주거 시트의 비주거 비율 기준 칸은 입력 칸 대신 총괄 시트의 고시 기준 칸을 참조한다.
  parcelSheets.forEach(sh => {
    const at = sh.cells.findIndex(c => c.kind === 'input' && /^F[0-9]+$/.test(c.ref) &&
      sh.cells.some(l => l.kind === 'label' && l.v === '비주거 비율' &&
        l.ref === 'B' + c.ref.slice(1)));
    if (at < 0) return;
    const ref = sh.cells[at].ref;
    const old = sh.cells[at];
    const holder = { name:sh.name, cells:[] };
    ovwPut(holder, ref, '=IFERROR(' + refs.stdRef.nonResMin + ',"입력 필요")',
      'calc', old.fmt, undefined, undefined, old.v);
    sh.cells[at] = holder.cells[0];
  });
  return {
    sheets:[
      ovwSummarySheet(inp, names, refs),
      ...parcelSheets,
      ovwTypeSheet(inp, names)
    ]
  };
}

function ovwLayoutCheck(layout) {
  const issues = [];
  const sheets = layout && Array.isArray(layout.sheets) ? layout.sheets : [];
  const byName = new Map();
  const bounds = new Map();
  const validKinds = new Set([
    'title', 'note', 'head', 'th', 'label',
    'input', 'calc', 'total', 'text'
  ]);
  const issue = (sh, ref, text) =>
    issues.push(String(sh.name) + ' / ' + ref + ': ' + text);

  sheets.forEach(sh => {
    const name = sh && sh.name;
    if (typeof name !== 'string' || !name.length || name.length > 31 ||
      /[\\/?*\[\]:]/.test(name) || /^'|'$/.test(name) ||
      String(name).toLowerCase() === 'history') {
      issues.push('잘못된 시트 이름: ' + String(name));
    }
    const key = String(name).toLowerCase();
    if (byName.has(key)) issues.push('시트 이름 중복: ' + String(name));
    else byName.set(key, sh);

    let maxC = 0;
    let maxR = 0;
    const occupied = [];
    (Array.isArray(sh.cells) ? sh.cells : []).forEach(c => {
      const p = ovwRefParse(c.ref);
      if (!p) {
        issue(sh, c.ref, '잘못된 칸 주소');
        return;
      }
      maxC = Math.max(maxC, p.c2);
      maxR = Math.max(maxR, p.r2);
      occupied.forEach(old => {
        if (p.c1 <= old.p.c2 && old.p.c1 <= p.c2 &&
          p.r1 <= old.p.r2 && old.p.r1 <= p.r2) {
          issue(sh, c.ref, '칸 겹침: ' + old.ref);
        }
      });
      occupied.push({ ref:c.ref, p });
      if (!validKinds.has(c.kind)) {
        issue(sh, c.ref, '허용되지 않은 칸 종류');
      }
      if (Object.hasOwn(c, 'v') && Object.hasOwn(c, 'f')) {
        issue(sh, c.ref, '값과 수식 동시 지정');
      }
      if (Object.hasOwn(c, 'f')) {
        if (typeof c.f !== 'string' || !c.f.startsWith('=')) {
          issue(sh, c.ref, '잘못된 수식');
        }
        const result = c.result;
        if (!(result === null || typeof result === 'string' ||
          typeof result === 'number' && Number.isFinite(result))) {
          issue(sh, c.ref, '잘못된 수식 결과');
        }
      }
    });
    bounds.set(sh, { c:maxC, r:maxR });
  });

  const checkRef = (from, cell, targetName, address) => {
    const target = targetName === null
      ? from : byName.get(targetName.toLowerCase());
    if (!target) {
      issue(from, cell.ref, '없는 시트 참조: ' + targetName);
      return;
    }
    const p = ovwRefParse(address);
    const b = bounds.get(target);
    if (!p || p.c2 > b.c || p.r2 > b.r) {
      issue(from, cell.ref, '참조 범위 밖: ' +
        (targetName || from.name) + '!' + address);
    }
  };

  sheets.forEach(sh => {
    (Array.isArray(sh.cells) ? sh.cells : []).forEach(c => {
      if (typeof c.f !== 'string') return;
      // 글자 상수와 시트 참조를 한 번에 구분하여 이름 속 큰따옴표도 보존한다.
      const tokens = /"(?:[^"]|"")*"|'((?:[^']|'')*)'!(\$?[A-Z]{1,3}\$?\d+(?::\$?[A-Z]{1,3}\$?\d+)?)|([A-Za-z_가-힣][A-Za-z0-9_.가-힣]*)!(\$?[A-Z]{1,3}\$?\d+(?::\$?[A-Z]{1,3}\$?\d+)?)|(\$?[A-Z]{1,3}\$?\d+(?::\$?[A-Z]{1,3}\$?\d+)?)/g;
      let last = 0;
      for (const m of c.f.matchAll(tokens)) {
        const gap = c.f.slice(last, m.index);
        if (gap.includes('!')) {
          issue(sh, c.ref, '해석할 수 없는 시트 참조');
        }
        last = m.index + m[0].length;
        if (m[0].startsWith('"')) continue;
        if (m[1] !== undefined) {
          checkRef(sh, c, m[1].replace(/''/g, "'"), m[2]);
          continue;
        }
        if (m[3] !== undefined) {
          checkRef(sh, c, m[3], m[4]);
          continue;
        }
        const before = c.f[m.index - 1] || '';
        const after = c.f.slice(last);
        if (/[A-Za-z0-9_.$]/.test(before) ||
          /^[A-Za-z0-9_]/.test(after) || /^\s*\(/.test(after)) continue;
        checkRef(sh, c, null, m[5]);
      }
      if (c.f.slice(last).includes('!')) {
        issue(sh, c.ref, '해석할 수 없는 시트 참조');
      }
    });
  });
  return issues;
}
// 쓰기: lib는 엑셀 라이브러리 객체. 수식 칸은 { formula, result } 로 쓴다(선행 '=' 제외).
function ovwWrite(lib, layout){
  const wb = new lib.Workbook();
  wb.calcProperties = { fullCalcOnLoad:true };
  const line = { style:'thin', color:{ argb:'FFD5DBE5' } };
  layout.sheets.forEach(sh => {
    const fz = /^([A-Z]+)(\d+)$/.exec(sh.freeze || ''), view = { showGridLines:false };
    if (fz) { view.state = 'frozen'; view.xSplit = fz[1].length === 1 ? fz[1].charCodeAt(0) - 65 : 0; view.ySplit = +fz[2] - 1; }
    const ws = wb.addWorksheet(sh.name, { views:[view], pageSetup:sh.print });
    sh.cols.forEach(c => { ws.getColumn(c.c).width = c.w; });
    sh.rows.forEach(r => { ws.getRow(r.r).height = r.h; });
    sh.cells.forEach(c => {
      const k = OVW_KIND[c.kind] || OVW_KIND.text, sc = OVW_SEC[c.sec];
      const fill = c.kind === 'head' && sc ? sc[0] : c.kind === 'th' && sc ? sc[1] : k.fill;
      const [from, to] = c.ref.split(':'), q = ovwRefParse(c.ref), box = [];
      for (let r = q.r1; r <= q.r2; r++) for (let n = q.c1; n <= q.c2; n++) box.push(ovwColName(n) + r);
      // 병합 범위는 안의 모든 칸에 같은 모양을 먼저 입힌 뒤 합친다.
      box.forEach(ref => {
        const cell = ws.getCell(ref);
        if (fill) cell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FF' + fill } };
        cell.font = { name:'맑은 고딕', size:k.size || 10, bold:!!k.bold, color:{ argb:'FF' + k.color } };
        if (c.kind !== 'title' && c.kind !== 'note') cell.border = { top:line, left:line, bottom:line, right:line };
        const h = c.h || k.align;
        cell.alignment = { horizontal:h, vertical:'middle', wrapText:c.kind === 'text' || c.kind === 'note' };
        if (h === 'left') cell.alignment.indent = 1;
        if (c.fmt) cell.numFmt = c.fmt;
      });
      const cell = ws.getCell(from);
      if (typeof c.f === 'string') {
        cell.value = { formula:c.f.slice(1) };
        if (c.result !== null && c.result !== undefined) cell.value.result = c.result;
      } else cell.value = c.v;
      if (to) ws.mergeCells(c.ref);
    });
    (sh.verdict || []).forEach(ref => {
      const rule = (word, bg, fg) => ({ type:'cellIs', operator:'equal', formulae:['"' + word + '"'],
        style:{ fill:{ type:'pattern', pattern:'solid', bgColor:{ argb:'FF' + bg } }, font:{ bold:true, color:{ argb:'FF' + fg } } } });
      ws.addConditionalFormatting({ ref, rules:[rule('충족', 'D5F0DE', '1E6B43'), rule('미달', 'FBDCCB', 'A1401B')] });
    });
  });
  return wb;
}

function ovwRefStatus(Z, key) {
  const r = OVW_REF.find(x => x.key === key);
  if (!r) {
    return { kind: 'unverified', text: '확인 필요', note: '' };
  }

  if (r.scope !== 'fixed' &&
      Z && Z[r.scope] &&
      Z[r.scope][key] !== r.def) {
    return { kind: 'user', text: '직접 입력', note: '' };
  }

  if (r.group === 'assume') {
    return { kind: 'assumed', text: '가정값', note: '' };
  }

  const filled = x => typeof x === 'string' && x.trim() !== '';
  const dated = x =>
    typeof x === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x);

  if (r.verified === true && filled(r.art) &&
      dated(r.eff) && dated(r.checked)) {
    return {
      kind: 'verified',
      text: '확인됨',
      note: r.art + ' · 시행일 ' + r.eff + ' · 확인일 ' + r.checked
    };
  }

  return { kind: 'unverified', text: '확인 필요', note: '' };
}

// 타입 추가·삭제는 순수 함수로 처리한다.

function ovwTypeListEdit(inp, action, id) {
  const no = { inp, ok: false };
  if (!inp || typeof inp !== 'object') return no;
  const Z = reviewOf(inp);

  if (action === 'add') {
    if (!ovwId(id) || Z.types.some(t => t.id === id)) return no;
  } else if (action === 'remove') {
    if (!Z.types.some(t => t.id === id)) return no;
  } else {
    return no;
  }

  const out = JSON.parse(JSON.stringify(inp));
  const R = reviewOf(out);

  if (action === 'add') {
    R.types.push({ id, name: '새 타입', ex: 0, wall: 0 });
  } else {
    R.types = R.types.filter(t => t.id !== id);

    parcelsOf(out).forEach(pc => {
      const rv = pc && pc.rv;
      if (!rv || typeof rv !== 'object' || Array.isArray(rv)) return;

      if (Array.isArray(rv.blds)) {
        rv.blds.forEach(b => {
          if (b && b.mix && typeof b.mix === 'object') {
            delete b.mix[id];
          }
        });
      }

      for (const key of ['rent', 'pub']) {
        if (rv[key] && typeof rv[key] === 'object') {
          delete rv[key][id];
        }
      }
    });
  }

  out.review = R;
  return { inp: out, ok: true };
}
// 08-03: 주거 획지 화면과 동 목록 편집.
function ovwBldListEdit(inp, action, pid, id) {
  const no = { inp, ok:false };
  if (!inp || typeof inp !== 'object') return no;

  const pc = parcelsOf(inp).find(p => p.id === pid);
  if (!pc) return no;
  const rv = rvOf(pc);
  if (rv.kind !== 'res') return no;

  if (action === 'add') {
    if (!ovwId(id) || rv.blds.some(b => b.id === id)) return no;
  } else if (action === 'remove') {
    if (!rv.blds.some(b => b.id === id)) return no;
  } else {
    return no;
  }

  const out = JSON.parse(JSON.stringify(inp));
  const target = parcelsOf(out).find(p => p.id === pid);
  const next = rvOf(target);

  if (action === 'add') {
    let n = 1;
    const names = new Set(next.blds.map(b => b.name));
    while (names.has('동 ' + n)) n++;
    const mix = {};
    reviewOf(out).types.forEach(t => { mix[t.id] = 0; });
    next.blds.push({ id, name:'동 ' + n, floors:0, mix });
  } else {
    next.blds = next.blds.filter(b => b.id !== id);
  }

  target.rv = next;
  return { inp:out, ok:true };
}

function ovwOutMap(inp, pid) {
  const Z = reviewOf(inp);
  if (pid == null) {
    const out = {};
    parcelsOf(inp).filter(p => rvOf(p).kind === 'res').forEach(pc => {
      const P = ovwParcel(Z, pc);
      out['rs' + pc.id] = ovwFmt(P.rentHh);
      out['ps' + pc.id] = ovwFmt(P.pubHh);
      out['ss' + pc.id] = ovwFmt(P.hh - P.rentHh - P.pubHh);
      Z.types.forEach(t => {
        out['sl' + pc.id + '_' + t.id] = ovwFmt(P.saleHh[t.id]);
      });
    });
    return out;
  }
  const pc = parcelsOf(inp).find(p => p.id === pid);
  if (!pc) return {};
  const rv = rvOf(pc), P = ovwParcel(Z, pc);
  const limit = x => x
    ? ovwFmt(x.v, Number.isInteger(x.v) ? 0 : 2) + '% · ' + x.src
    : '한도 입력 필요';
  const out = { 'lim-far':limit(P.lim.far), 'lim-bcr':limit(P.lim.bcr) };
  if (rv.kind === 'non') {
    P.uses.forEach(u => { out['mx' + u.id] = ovwFmt(u.area, 2); });
    out.mxs = ovwFmt(P.mixSum, 2) + '%';
    out.mxa = ovwFmt(P.up * P.mixSum / 100, 2);
    out.mxstate = P.checks.find(c => c.id === 'mix').ok ? '충족' : '미달';
    return out;
  }
  out.hh = ovwFmt(P.hh);
  rv.blds.forEach(b => { out['bu' + b.id] = ovwFmt(P.byB[b.id]); });
  Z.types.forEach(t => { out['tu' + t.id] = ovwFmt(P.u[t.id]); });
  P.amen.forEach(a => {
    out['am-' + a.key] = a.auto
      ? '자동 ' + ovwFmt(a.plan) + '㎡'
      : '입력 ' + ovwFmt(a.plan) + '㎡ · 법정 ' + ovwFmt(a.law) + '㎡';
  });
  return out;
}

  const amenities = section('부대복리시설', 'lav', table(
