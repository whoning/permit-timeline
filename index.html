<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="사업 개요를 넣으면 심의·영향평가 대상을 판정하고 인허가 일정표를 만드는 도구">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%231a4f9c%27/%3E%3Crect x=%277%27 y=%279%27 width=%2712%27 height=%274%27 rx=%271%27 fill=%27%23fff%27/%3E%3Crect x=%2712%27 y=%2716%27 width=%2713%27 height=%274%27 rx=%271%27 fill=%27%23c8961e%27/%3E%3C/svg%3E">
</head>
<body>
<title>인허가 타임라인</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: 상단 프로젝트 바 → 단계 탭(개요·판정·일정) → 탭별 작업면. 일정 탭은 간트(좌) + 속성 패널(우). */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#f0f3f8; --fg:#152033; --muted:#5b6678; --line:#d9dfe8; --line2:#edf0f5;
  --accent:#1a4f9c; --accent-weak:#e6edf8; --accent-fg:#ffffff; --gold:#b9861a; --gold-weak:#faf2de;
  --ok:#23704a; --ok-weak:#e2f2e9; --warn:#9a5a00; --warn-weak:#fcefd9; --no:#6a7484; --no-weak:#eceff3; --danger:#b3261e;
  --today:#d0342c; --shadow:0 6px 24px rgba(20,32,51,.12);
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#151c26; --surface2:#1b2431; --fg:#e4e9f0; --muted:#97a2b3; --line:#2b3645; --line2:#202a37;
  --accent:#7aa5ea; --accent-weak:#1e2d45; --accent-fg:#0e131a; --gold:#e0b04a; --gold-weak:#3a2f15;
  --ok:#6cc596; --ok-weak:#173527; --warn:#f0b35a; --warn-weak:#3b2a10; --no:#9aa4b4; --no-weak:#232c38; --danger:#ff8a80;
  --today:#ff6b61; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#151c26; --surface2:#1b2431; --fg:#e4e9f0; --muted:#97a2b3; --line:#2b3645; --line2:#202a37;
  --accent:#7aa5ea; --accent-weak:#1e2d45; --accent-fg:#0e131a; --gold:#e0b04a; --gold-weak:#3a2f15;
  --ok:#6cc596; --ok-weak:#173527; --warn:#f0b35a; --warn-weak:#3b2a10; --no:#9aa4b4; --no-weak:#232c38; --danger:#ff8a80;
  --today:#ff6b61; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark;}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:13px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:10px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand b{font-size:14px;font-weight:700;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:11px}
.proj{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.proj select{max-width:280px}
.grow{flex:1}
.save{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.save i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.save.busy i{background:var(--gold)} .save.local i{background:var(--no)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap;line-height:1.4}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
select,input[type=text],input[type=number],input[type=month],textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 8px;min-width:0}
textarea{resize:vertical}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:6px;z-index:50;min-width:210px;display:flex;flex-direction:column}
.menu-pop[hidden]{display:none}
.menu-pop button{text-align:left;border:0;background:none;padding:7px 10px;border-radius:5px;cursor:pointer}
.menu-pop button:hover{background:var(--accent-weak)}
.menu-pop small{color:var(--muted);display:block;font-size:11px}
/* tabs */
.tabs{display:flex;gap:2px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px 9px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;display:flex;gap:8px;align-items:center;white-space:nowrap}
.tab .no{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tab .cnt{font-size:11px;background:var(--accent-weak);color:var(--accent);border-radius:9px;padding:0 7px;font-weight:600}
main{min-height:0;overflow:hidden;position:relative}
.view{height:100%;overflow:auto}
.view[hidden]{display:none}
/* input form */
.form{max-width:1080px;margin:0 auto;padding-block:20px 40px;display:grid;gap:18px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.sec h2{font-size:13.5px;margin:0 0 12px;display:flex;gap:8px;align-items:baseline}
.sec h2 small{font-weight:400;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12px;color:var(--muted)}
.fld .hint{font-size:11px;color:var(--muted)}
.fld .src{font-size:11px;color:var(--accent);line-height:1.4}
.unk{font-style:normal;font-size:10.5px;font-weight:600;color:var(--warn);background:var(--warn-weak);border-radius:4px;padding:0 5px;margin-left:4px}
.memo{width:100%;min-height:120px;line-height:1.55}
.fld input,.fld select{width:100%}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.unit{display:flex;align-items:center;gap:6px}.unit span{color:var(--muted);font-size:12px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 14px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;cursor:pointer}
.chk:hover{border-color:var(--line)}
.chk input{margin-top:3px}
.chk small{display:block;color:var(--muted);font-size:11.5px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{font-size:12px;color:var(--muted)}
.banner{border-radius:8px;padding:10px 14px;font-size:12.5px;border:1px solid}
.banner.warn{background:var(--warn-weak);border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--fg)}
.banner.info{background:var(--accent-weak);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
/* verdict */
.vwrap{max-width:1280px;margin:0 auto;padding-block:20px 40px;display:grid;gap:14px}
.sum{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.sum .k{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:120px}
.sum .k b{font-size:22px;font-family:var(--f-mono);font-weight:500;display:block;line-height:1.2}
.sum .k span{font-size:12px;color:var(--muted)}
.sum .path{flex:1;min-width:240px;display:flex;flex-direction:column;justify-content:center}
.sum .path b{font-family:var(--f-body);font-size:15px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table.vt{border-collapse:collapse;width:100%;min-width:980px}
.vt th{font-size:11.5px;color:var(--muted);font-weight:500;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface2);position:sticky;top:0}
.vt td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.vt tr.cat td{background:var(--surface2);font-weight:600;font-size:12px;color:var(--muted);padding:6px 12px}
.vt .nm{font-weight:600}
.vt .why{color:var(--fg)}
.vt .law{font-size:12px;color:var(--muted)}
.vt .memo{font-size:11.5px;color:var(--muted);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.Y{background:var(--ok-weak);color:var(--ok)} .pill.N{background:var(--no-weak);color:var(--no)} .pill.Q{background:var(--warn-weak);color:var(--warn)}
.pill.ov{outline:1px dashed currentColor}
.conf{font-size:11px;white-space:nowrap;border-radius:4px;padding:1px 6px;border:1px solid var(--line)}
.conf.A{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.conf.C{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
/* gantt */
.gview{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:100%}
.gmain{display:grid;grid-template-rows:auto 1fr;min-width:0;min-height:0}
.gtool{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.gtool .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.gtool .zoom{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);min-width:64px;text-align:center}
.gscroll{overflow:auto;position:relative;background:var(--surface);min-height:0}
.gbody{position:relative;min-width:max-content}
.g-row{display:flex;height:30px;border-bottom:1px solid var(--line2)}
.g-left{position:sticky;left:0;z-index:3;background:var(--surface);display:flex;align-items:center;border-right:1px solid var(--line);flex:none}
.g-left .c-nm{flex:1;min-width:0;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-left .c-ow{width:64px;padding:0 8px;color:var(--muted);font-size:12px;border-left:1px solid var(--line2);height:100%;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.g-left .c-nt{width:150px;padding:0 8px;color:var(--muted);font-size:11.5px;border-left:1px solid var(--line2);height:100%;display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.g-time{position:relative;flex:none;background-image:linear-gradient(to right,var(--line2) 1px,transparent 1px);}
.g-row.sel .g-left,.g-row.sel .g-time{background-color:var(--accent-weak)}
.g-row.grp{height:28px;background:var(--surface2)}
.g-row.grp .g-left{background:var(--surface2);font-weight:600;font-size:12px}
.g-row.grp .g-time{background-image:none}
.g-row.grp .c-nm{display:flex;gap:6px;align-items:center}
.g-row.grp .c-nm em{font-style:normal;color:var(--muted);font-weight:400;font-family:var(--f-mono);font-size:11px}
.g-row.item .c-nm{padding-left:22px;cursor:pointer}
.g-row.item .c-nm .tag{font-size:10.5px;color:var(--warn);margin-left:6px}
.g-head{position:sticky;top:0;z-index:5;height:auto;background:var(--surface);border-bottom:1px solid var(--line)}
.g-head .g-left{z-index:6;height:44px;font-size:11.5px;color:var(--muted);align-items:flex-end;padding-bottom:6px}
.g-head .g-time{height:44px;background-image:none}
.hm{position:absolute;top:0;height:26px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;border-left:1px solid var(--line2);white-space:nowrap;overflow:hidden}
.hm.yr{border-left-color:var(--line)}
.hq{position:absolute;top:26px;height:18px;font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono)}
.bar{position:absolute;top:6px;height:18px;border-radius:4px;cursor:grab;display:flex;align-items:center;padding:0 6px;font-size:11px;color:#fff;white-space:nowrap;overflow:hidden;font-family:var(--f-mono);touch-action:none;user-select:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.bar.tent{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 4px,transparent 4px 8px);outline:1.5px dashed var(--warn);outline-offset:1px}
.bar.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.bar .h{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize}
.bar .h.l{left:0}.bar .h.r{right:0}
.bar.dark-text{color:#14202f}
.ms{position:absolute;top:7px;width:16px;height:16px;margin-left:-8px;cursor:grab;touch-action:none}
.ms i{position:absolute;inset:2px;transform:rotate(45deg);border-radius:2px;box-shadow:0 0 0 1.5px var(--surface)}
.ms.sel i{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.ms span{position:absolute;left:16px;top:-1px;font-size:11px;white-space:nowrap;color:var(--fg);pointer-events:none}
.bar-lbl{position:absolute;top:6px;font-size:11px;color:var(--muted);white-space:nowrap;pointer-events:none;line-height:18px}
.today{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed var(--today);z-index:2;pointer-events:none}
.today b{position:absolute;top:2px;left:3px;font-size:10px;color:var(--today);font-weight:600;white-space:nowrap;background:var(--surface);padding:0 3px}
svg.deps{position:absolute;pointer-events:none;z-index:2;overflow:visible}
svg.deps path{fill:none;stroke:var(--muted);stroke-width:1.2;opacity:.75}
svg.deps path.hot{stroke:var(--accent);opacity:1;stroke-width:1.6}
.gempty{padding:40px;text-align:center;color:var(--muted)}
/* inspector */
.insp{border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:14px 16px 30px;display:flex;flex-direction:column;gap:14px;min-height:0}
.insp h3{font-size:12px;margin:0;color:var(--muted);font-weight:600;letter-spacing:.02em}
.insp .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.insp .fld input,.insp .fld select,.insp .fld textarea{width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:5px 6px;cursor:pointer;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:600}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pal button{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:6px;cursor:pointer;text-align:left;font-size:11.5px}
.pal button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pal .sw{display:flex;height:8px;border-radius:2px;overflow:hidden;margin-bottom:4px}
.pal .sw i{flex:1}
.deplist{display:flex;flex-direction:column;gap:4px}
.deplist .d{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;background:var(--surface2);border-radius:5px;padding:3px 4px 3px 8px}
.why-box{font-size:12px;background:var(--surface2);border-radius:8px;padding:10px 12px;display:grid;gap:4px}
.why-box .law{color:var(--muted);font-size:11.5px}
.tgl{display:flex;gap:8px;align-items:center;font-size:12.5px;cursor:pointer}
/* footer */
.foot{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding-block:6px;background:var(--surface);border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.foot b{color:var(--fg);font-weight:600}
/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,16,24,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal .box{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);max-width:440px;width:100%;padding:20px;display:grid;gap:14px}
.modal .box p{margin:0;font-size:13.5px}
.modal .box.guide{max-width:560px;max-height:calc(100% - 32px);overflow:auto}
.guide h2{margin:0;font-size:17px}
.guide ol{margin:0;padding-left:20px;display:grid;gap:6px}
.guide .k2{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:12.5px;display:grid;gap:4px}
.guide .k2 b{font-size:12px}
.modal .box .actions{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(52px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:12.5px;z-index:120;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (max-width:900px){
  .gview{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .insp{border-left:0;border-top:1px solid var(--line);max-height:42vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <header class="top wrap">
    <div class="brand"><b>인허가 타임라인</b><small>개요 → 법령 판정 → 인허가 일정표</small></div>
    <div class="proj">
      <select id="projSel" aria-label="프로젝트 선택"></select>
      <button class="btn sm" id="bNew">새 프로젝트</button>
      <button class="btn sm" id="bDup">복제</button>
      <button class="btn sm ghost" id="bDel">삭제</button>
    </div>
    <div class="grow"></div>
    <button class="btn sm ghost" id="bHelp">사용 안내</button>
    <div class="save" id="saveSt"><i></i><span>불러오는 중</span></div>
    <button class="btn sm" id="bUndo" title="되돌리기 (Ctrl+Z)">↶</button>
    <button class="btn sm" id="bRedo" title="다시 하기 (Ctrl+Y)">↷</button>
    <div class="menu">
      <button class="btn pri sm" id="bExp" aria-haspopup="true">내보내기</button>
      <div class="menu-pop" id="expMenu" hidden>
        <button data-x="xlsx">Excel (.xlsx)<small>개요 · 판정 근거 · 일정표 3개 시트</small></button>
        <button data-x="png">이미지 (.png)<small>일정표 그림</small></button>
        <button data-x="pdf">PDF (A3 가로)<small>일정표 그림을 A3 가로에 배치</small></button>
        <button data-x="json">데이터 백업 (.json)<small>다시 불러올 수 있는 원본 데이터</small></button>
        <button data-x="import">백업 불러오기…<small>.json 파일을 새 프로젝트로</small></button>
      </div>
      <input type="file" id="fImport" accept=".json,application/json" hidden>
    </div>
  </header>
  <nav class="tabs wrap" role="tablist">
    <button class="tab" role="tab" data-tab="input"><span class="no">01</span>사업 개요</button>
    <button class="tab" role="tab" data-tab="verdict"><span class="no">02</span>법령 판정<span class="cnt" id="vCnt"></span></button>
    <button class="tab" role="tab" data-tab="gantt"><span class="no">03</span>인허가 일정표</button>
  </nav>
  <main>
    <section class="view" id="vInput"></section>

  memo:'서울: 심의대상건축물(다중이용건축물·시가지/특화경관지구 내·분양 목적) 중 연면적 합계 10만㎡ 이상 또는 21층 이상 → 시 건축위원회. 다른 시·도는 건축조례로 확인(21층·10만㎡ 이상은 시행령 제8조 광역 허가·도지사 승인 대상).',

 {id:'bc_local', cat:'심의', name:'건축위원회 심의 (시·군·구)', law:'서울시 건축조례 제7조①2다 [시행 2026.3.30.] · 각 시·군·구 건축조례', conf:'A',

 {id:'landscape', cat:'심의', name:'경관심의 (건축물)', law:'경관법 제28조 · 서울시 경관조례 제24조 [시행 2025.9.29.]', conf:'A',

 {id:'traffic', cat:'영향평가', name:'교통영향평가', law:'도시교통정비 촉진법 시행령 [별표1] (2024.2.6. 개정) · 서울시 교통영향평가에 관한 조례 [별표] (2024.3.26. 개정)', conf:'A',

      const rg = c.gfa*c.resRatio/100, ng = c.gfa - rg;
      const swa = (rg/TH.apt + ng/TH.nonres) * 10000;
      const why = `${tag}복합용도 Swa = (주택 ${fA(rg)}÷${TH.apt.toLocaleString('ko-KR')} + 비주거 ${fA(ng)}÷${TH.nonres.toLocaleString('ko-KR')})×10,000 = ${f1(swa)}`;

      const ok = c.gfa >= TH[c.use];

      return N(why);
    }
    if (S && c.gfa>=3000) return Q(`${USES[c.use]} — 조례 별표 용도별 기준·부설주차장 설치제한지역 여부 확인`);
    return c.gfa>=10000 ? Q(`${USES[c.use]} — 별표1 용도별 기준 확인`) : N('용도별 기준 미만으로 추정 — 별표 확인 권장');

 {id:'env', cat:'영향평가', name:'환경영향평가', law:'환경영향평가법 시행령 [별표3] · 서울시 환경영향평가 조례 [별표1] (2024.9.30. 개정)', conf:'A',

/* ---------- 판정 ---------- */
function derive(inp){
  const z = ZONES.find(z => z[0]===inp.zone) || ZONES[4];
  const n = k => Math.max(0, +inp[k] || 0);
  const basements = n('basements'), floors = n('floors'), depthIn = n('depth');
  const depth = depthIn>0 ? depthIn : (basements ? +(basements*3.6+1.5).toFixed(1) : 0);
  const rr = inp.resRatio==='' || inp.resRatio==null ? 100 : n('resRatio');
  const c = { ...inp, zoneName:z[1], zk:z[2], urban:z[2]!=='nonurban', green:z[2]==='green', isSeoul:inp.sido==='서울특별시',
    redevKind: inp.redevKind||'redevelop', site:n('site'), area:n('area')||n('site'), gfa:n('gfa'), maxBld:n('maxBld')||n('gfa'), floors, basements, height:n('height'),
    depth, depthEst:!(depthIn>0), hh:Math.round(n('hh')), resRatio:rr, res:inp.use==='apt'||inp.use==='mixed', pub:inp.owner==='public', f:inp.flags||{} };
  c.multi = floors>=16 || (['retail','hotel','culture'].includes(c.use) && c.gfa>=5000);
  c.sale = !!c.f.sale || (c.res && !c.pub);
  c.bcTarget = c.multi || !!c.f.scenic || c.sale;
  c.bcTargetWhy = c.multi ? '다중이용건축물' : c.f.scenic ? '경관지구 내 건축물' : '분양 목적 건축물';
  c.unk = inp.unk || {};
  c.buildEst = !!(c.unk.floors || c.unk.basements);
  c.buildMonths = c.buildEst ? 36 : Math.max(8, Math.round(12 + 0.75*floors + 1.5*basements));
  return c;
}
function judge(inp){
  const c = derive(inp), V = {};
  V.hap = RULE.hap.fn(c, V);
  c.path = inp.type==='redev' ? 'redev' : (V.hap.s==='Y' ? 'housing' : 'permit');
  for (const r of RULES) if (r.id!=='hap') V[r.id] = r.fn(c, V);
  for (const id in NEEDS) {
    if (!V[id] || V[id].s!=='N') continue;
    if (id==='hap' && c.type==='redev') continue;
    // 굴착깊이는 지하층수로 추정할 수 있으므로 둘 다 확인 필요일 때만 보정
    const miss = NEEDS[id].filter(k => c.unk[k] && !(k==='depth' && !c.unk.basements) && !(k==='basements' && !c.unk.depth) && !(k==='maxBld' && !c.unk.gfa));
    if (miss.length) V[id] = Q(`확인 필요 입력값: ${[...new Set(miss.map(k => FIELD_LABEL[k]||k))].join('·')} — 현재 입력 기준으로는 "${V[id].r}"`);
  }
  return { c, V };
}
function effective(p){
  const { c, V } = judge(p.input), E = {};
  for (const r of RULES) E[r.id] = (p.overrides||{})[r.id] || V[r.id].s;
  return { c, V, E };
}

const endOf = r => r.start + (r.ms ? 0 : r.dur);
function propagate(rows, reset){
  const m = new Map(rows.map(r => [r.id, r]));
  const order = topo(rows);
  for (const r of order) {
    const ds = r.deps.map(d => m.get(d)).filter(Boolean);
    const need = ds.length ? Math.max(...ds.map(endOf)) : 0;
    r.start = reset ? need : Math.max(r.start, need);
  }
}
function topo(rows){
  const m = new Map(rows.map(r => [r.id, r])), seen = new Set(), out = [];
  const visit = (r, stack) => { if (seen.has(r.id) || stack.has(r.id)) return; stack.add(r.id);
    r.deps.forEach(d => m.get(d) && visit(m.get(d), stack)); stack.delete(r.id); seen.add(r.id); out.push(r); };
  rows.forEach(r => visit(r, new Set()));
  return out;
}

const LS = 'permit-timeline.v1';
const store = {
  mode:'local', db:null, uid:null,
  async init(){
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.db = db; this.uid = id; this.mode = 'cloud';
    } catch(e) { this.mode = 'local'; }
  },
  col(){ return this.db.collection('data/users/' + this.uid); },
  async list(){
    if (this.mode==='cloud') { const s = await this.col().get(); return s.docs.map(d => d.data()).filter(Boolean).map(x => JSON.parse(JSON.stringify(x))); }
    try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch(e) { return []; }
  },
  async put(p){
    const body = JSON.parse(JSON.stringify(p));
    if (this.mode==='cloud') return this.col().doc(p.id).set(body);
    try { const all = await this.list(); const i = all.findIndex(x => x.id===p.id); if (i>=0) all[i] = body; else all.push(body); localStorage.setItem(LS, JSON.stringify(all)); } catch(e) {}
  },
  async del(id){
    if (this.mode==='cloud') return this.col().doc(id).delete();
    try { localStorage.setItem(LS, JSON.stringify((await this.list()).filter(x => x.id!==id))); } catch(e) {}
  }
};
let saveTimer = null, saving = Promise.resolve(), dirtyIds = new Set();
function setSave(t, cls){ const el = $('#saveSt'); el.className = 'save ' + (cls||''); el.querySelector('span').textContent = t; }
function touch(){
  const p = S.cur; if (!p) return;
  p.updatedAt = Date.now(); p.example = false; dirtyIds.add(p.id);
  setSave('저장 중', 'busy');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 1200);
}
function flush(){
  const ids = [...dirtyIds]; dirtyIds.clear();
  saving = saving.then(async () => {
    try { for (const id of ids) { const p = S.projects.find(x => x.id===id); if (p) await store.put(p); }
      setSave(store.mode==='cloud' ? '저장됨' : '이 브라우저에 저장됨', store.mode==='cloud' ? '' : 'local');
    } catch(e) {
      if (store.mode==='cloud' && e && e.code==='invalid_argument') {
        // 보기 전용 권한 등으로 계정 저장이 막히면 이 브라우저 저장으로 전환
        store.mode = 'local';
        for (const p of S.projects) await store.put(p);
        setSave('보기 권한 — 이 브라우저에 저장됨', 'local');
        return;
      }
      setSave(e && e.code==='quota_exceeded' ? '저장 공간이 가득 찼습니다' : '저장 실패 — 다시 시도', 'busy'); ids.forEach(i => dirtyIds.add(i));
    }
  });
}

/* ---------- 상태 · 되돌리기 ---------- */
const S = { projects:[], cur:null, sel:null, tab:'gantt', hist:[], fut:[] };
const $ = s => document.querySelector(s);
const snapOf = p => JSON.stringify({ input:p.input, overrides:p.overrides, rows:p.rows, settings:p.settings });
function snap(){ if (!S.cur) return; S.hist.push(snapOf(S.cur)); if (S.hist.length>60) S.hist.shift(); S.fut = []; updUndo(); }
function restore(json){ const o = JSON.parse(json); Object.assign(S.cur, o); touch(); renderAll(); }
function undo(){ if (!S.hist.length) return; S.fut.push(snapOf(S.cur)); restore(S.hist.pop()); updUndo(); }
function redo(){ if (!S.fut.length) return; S.hist.push(snapOf(S.cur)); restore(S.fut.pop()); updUndo(); }
function updUndo(){ $('#bUndo').disabled = !S.hist.length; $('#bRedo').disabled = !S.fut.length; }

/* ---------- 공통 UI ---------- */
function toast(t){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
function ask(msg, ok='확인', danger){
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="box" role="dialog" aria-modal="true"><p>${esc(msg)}</p><div class="actions"><button class="btn" data-a="0">취소</button><button class="btn pri" data-a="1"${danger?' style="background:var(--danger);border-color:var(--danger)"':''}>${esc(ok)}</button></div></div>`;
    m.addEventListener('click', e => { const a = e.target.closest('[data-a]'); if (a || e.target===m) { m.remove(); res(a && a.dataset.a==='1'); } });
    document.body.appendChild(m); m.querySelector('[data-a="1"]').focus();
  });
}
function setTab(t){
  S.tab = t;

}

$('#vInput').addEventListener('change', e => {
  const t = e.target, p = S.cur;

  if (p.input.unk && p.input.unk[k] && (t.dataset.f || t.value!=='')) { p.input.unk = { ...p.input.unk }; delete p.input.unk[k]; const y = $('#vInput').scrollTop; renderInput(); $('#vInput').scrollTop = y; }
  touch(); updCount(); renderFoot();
  if (['use','type','sido','basements','gfa','site','name'].includes(t.dataset.k)) { const y = $('#vInput').scrollTop; renderInput(); $('#vInput').scrollTop = y; if (t.dataset.k==='name') renderProjSel(); }

$('#vInput').addEventListener('click', async e => {
  if (e.target.id==='bSeeV') setTab('verdict');
  if (e.target.id==='bRun') await regenerate();
});
async function regenerate(){
  const p = S.cur;
  if (p.rows.length && !(await ask('판정 결과대로 일정표를 새로 만듭니다. 손으로 고친 일정은 바뀝니다(되돌리기 가능).', '새로 만들기'))) return;
  snap();
  const { c, E } = effective(p);
  p.rows = buildRows(c, E); S.sel = null; p.stale = false;
  touch(); setTab('gantt'); renderFoot();
}

/* ---------- 03 일정표 ---------- */
const LEFT_NM = 250;
const leftW = st => LEFT_NM + (st.showOwner ? 64 : 0) + (st.showNote ? 150 : 0);
const rowById = id => S.cur.rows.find(r => r.id===id);
const colorOf = r => r.color || PALETTES[S.cur.settings.palette].c[r.cat] || '#1a4f9c';
const spanMonths = rows => Math.max(36, Math.ceil(Math.max(0, ...rows.map(endOf))) + 6);
function ymAdd(base, m){ const [y, mo] = (base||nowYM()).split('-').map(Number); const t = y*12 + (mo-1) + Math.floor(m); return [Math.floor(t/12), t%12 + 1]; }
const ymStr = (base, m) => { const [y, mo] = ymAdd(base, m); return `${y}.${String(mo).padStart(2,'0')}`; };
const fmtDur = d => d<1 ? `${Math.round(d*4)}주` : `${+d.toFixed(2)}개월`;
const fmtAt = (st, m) => st.axis==='ym' ? `${ymStr(st.base, m)}${m%1 ? ` ${Math.round((m%1)*4)+1}주` : ''}` : `${+(m+1).toFixed(2)}M`;

function renderGanttAll(){ if (S.tab!=='gantt') return; renderTool(); renderGantt(); renderInsp(); }
function renderTool(){
  const st = S.cur.settings;
  $('#gTool').innerHTML = `
    <button class="btn sm" id="gAdd">+ 행</button>
    <button class="btn sm" id="gMs">+ 마일스톤</button>
    <span class="sep"></span>
    <button class="btn sm" id="gFix" title="앞 단계보다 먼저 시작하는 항목을 뒤로 밀어 맞춥니다">선후관계 맞추기</button>
    <button class="btn sm" id="gRegen">판정대로 다시 만들기</button>
    <span class="sep"></span>
    <button class="btn sm" id="gZo" aria-label="축소">−</button><span class="zoom">${st.px}px/월</span><button class="btn sm" id="gZi" aria-label="확대">+</button>
    <button class="btn sm" id="gFit">맞춤</button>`;
}
function renderGantt(){
  const p = S.cur, st = p.settings, px = st.px, rows = p.rows;
  const body = $('#gBody');
  if (!rows.length) { body.innerHTML = `<div class="gempty">아직 일정이 없습니다.<br><br><button class="btn pri" id="gEmptyRun">판정하고 일정표 만들기</button><br><br><span class="note">01 사업 개요를 먼저 입력하세요.</span></div>`; return; }
  const M = spanMonths(rows), W = M*px, LW = leftW(st);
  const leftHead = `<div class="g-left" style="width:${LW}px"><div class="c-nm">구분 · 항목</div>${st.showOwner?'<div class="c-ow">담당</div>':''}${st.showNote?'<div class="c-nt">비고</div>':''}</div>`;
  let hm = '', hq = '';
  for (let m = 0; m < M; m++) {
    const [y, mo] = ymAdd(st.base, m);
    const lab = st.axis==='ym' ? (mo===1 || m===0 ? `${y}.${String(mo).padStart(2,'0')}` : `${mo}월`) : `${m+1}M`;
    const step = px < 36 ? (st.axis==='ym' ? 3 : 3) : 1;
    hm += `<div class="hm${st.axis==='ym'&&mo===1?' yr':''}" style="left:${m*px}px;width:${px}px">${m%step===0 || (st.axis==='ym'&&mo===1) ? lab : ''}</div>`;
    if (px >= 48) for (let q = 0; q < 4; q++) hq += `<div class="hq" style="left:${m*px + q*px/4}px;width:${px/4}px">${q+1}</div>`;
  }
  let html = `<div class="g-row g-head">${leftHead}<div class="g-time" style="width:${W}px">${hm}${hq}</div></div>`;
  const yMap = {}; let y = 44;
  const gridBg = `background-size:${px}px 100%`;
  for (const [cat, label] of CATS) {
    const rs = rows.filter(r => r.cat===cat); if (!rs.length) continue;
    html += `<div class="g-row grp" data-cat="${cat}"><div class="g-left" style="width:${LW}px"><div class="c-nm"><i style="width:8px;height:8px;border-radius:2px;background:${PALETTES[st.palette].c[cat]}"></i>${label}<em>${rs.length}</em></div></div><div class="g-time" style="width:${W}px"></div></div>`;
    y += 29;
    for (const r of rs) {
      yMap[r.id] = y + 15;
      const sel = S.sel===r.id, col = colorOf(r), x = r.start*px;
      const tag = r.tent ? '<span class="tag">확인 필요</span>' : '';
      let mark;
      if (r.ms) mark = `<div class="ms${sel?' sel':''}" data-id="${r.id}" style="left:${x}px" title="${esc(r.name)} · ${fmtAt(st, r.start)}"><i style="background:${col}"></i><span>${fmtAt(st, r.start)}</span></div>`;
      else {
        const w = Math.max(4, r.dur*px);
        mark = `<div class="bar${r.tent?' tent':''}${sel?' sel':''}${LIGHT_TEXT.has(col)?' dark-text':''}" data-id="${r.id}" style="left:${x}px;width:${w}px;background-color:${col}" title="${esc(r.name)} · ${fmtAt(st, r.start)} ~ ${fmtAt(st, endOf(r))} (${fmtDur(r.dur)})"><span class="h l"></span>${w>44 ? fmtDur(r.dur) : ''}<span class="h r"></span></div>`

      }

      y += 31;
    }
  }
  // 기준선(오늘)
  let today = '';
  if (st.axis==='ym' && st.todayLine) {
    const [by, bm] = (st.base||nowYM()).split('-').map(Number), d = new Date();
    const m = (d.getFullYear()*12 + d.getMonth()) - (by*12 + bm - 1) + (d.getDate()-1)/30;

    for (const r of rows) for (const d of r.deps) {
      const a = rowById(d); if (!a || yMap[a.id]==null || yMap[r.id]==null) continue;

    }
  }
  body.innerHTML = html + today + `<svg class="deps" style="left:${LW}px;top:0" width="${W}" height="${y}">${paths}</svg>`;
  // 프로젝트를 처음 열 때 오늘(연·월 표기) 6개월 전으로 이동
  if (S.needScroll && $('#gScroll').clientWidth > 0) { S.needScroll = false; const [by, bm] = (st.base||nowYM()).split('-').map(Number), d = new Date(); const tm = (d.getFullYear()*12 + d.getMonth()) - (by*12 + bm - 1); $('#gScroll').scrollLeft = st.axis==='ym' && tm > 6 ? (tm - 6)*px : 0; }

  const r = rowById(el.dataset.id); if (!r) return;
  const mode = e.target.classList.contains('l') ? 'l' : e.target.classList.contains('r') ? 'r' : 'm';
  drag = { r, el, mode, x0:e.clientX, s0:r.start, d0:r.dur, moved:false, pre:snapOf(S.cur) };
  el.setPointerCapture(e.pointerId); e.preventDefault();

$('#gBody').addEventListener('pointermove', e => {
  if (!drag) return;
  const px = S.cur.settings.px, dm = Math.round(((e.clientX - drag.x0) / px) * 4) / 4;
  if (!drag.moved && Math.abs(e.clientX - drag.x0) < 3) return;
  drag.moved = true;
  const r = drag.r;
  if (drag.mode==='m') r.start = Math.max(0, drag.s0 + dm);
  else if (drag.mode==='r') r.dur = Math.max(0.25, drag.d0 + dm);
  else { const ns = Math.max(0, Math.min(drag.s0 + drag.d0 - 0.25, drag.s0 + dm)); r.dur = drag.d0 + (drag.s0 - ns); r.start = ns; }
  drag.el.style.left = r.start*px + 'px';
  if (!r.ms) drag.el.style.width = Math.max(4, r.dur*px) + 'px';
});

};

let dlNS;
async function saveFile(name, data, mime){
  if (dlNS === undefined) { try { dlNS = (window.claude && claude.use) ? await claude.use('downloads') : null; } catch(e) { dlNS = null; } }
  if (dlNS) {
    try { await dlNS.save({ filename:name, data }); toast(`${name} 내보냄`); }
    catch(e) { if (e && e.code==='declined') return; toast('내보내지 못했습니다: ' + (e && (e.message||e.code) || '')); }
    return;
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type:mime });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

    ['지상층수',c.unk.floors?'확인 필요':c.floors,sr('floors')],['지하층수',c.unk.basements?'확인 필요':c.basements,sr('basements')],['최고높이(m)',c.unk.height?'확인 필요':c.height,sr('height')],['굴착깊이(m)',c.unk.depth&&c.unk.basements?'확인 필요':c.depth, sr('depth') || (c.depthEst&&c.basements?`추정: 지하 ${c.basements}층 × 3.6 + 1.5`:'')],['세대수',c.unk.hh?'확인 필요':c.hh,sr('hh')],
    ['특이사항', FLAGS.filter(f => c.f[f[0]]).map(f => f[1]).join(', ') || '없음',''],
    ['특이사항 확인 필요', FLAGS.filter(f => c.unk[f[0]]).map(f => f[1]).join(', ') || '없음',''],
    ['참고 사항', i.memo || '', ''],
    ['판정 기준표', `v${RULESET.version}`, `${RULESET.date} 확인 · 법적 판단을 대신하지 않음`]];
  const vt = [['구분','항목','판정','직접 지정','판단 근거','근거 법령','기준 메모','기준 신뢰도','확인일']].concat(RULES.map(r => [r.cat, r.name, ST[E[r.id]], (p.overrides||{})[r.id] ? '예' : '', V[r.id].r, r.law, r.memo, CONF[r.conf], RULESET.date]));

  const out = XLSX.write(wb, { bookType:'xlsx', type:'array' });
  await saveFile(fileBase() + '_인허가일정.xlsx', new Blob([out], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), '');
}
async function drawCanvas(){
  try { await document.fonts.ready; } catch(e) {}
  const p = S.cur, st = p.settings, pal = PALETTES[st.palette].c, rows = p.rows;
  const M = spanMonths(rows), px = Math.max(18, Math.min(40, Math.floor(1700 / M))), LW = 300, RH = 24, GH = 22, HH = 46, TH = 58;
  const ordered = CATS.map(([k,l]) => [k, l, rows.filter(r => r.cat===k)]).filter(x => x[2].length);
  const H = TH + HH + ordered.reduce((s, x) => s + GH + x[2].length*RH, 0) + 30, W = LW + M*px + 24, sc = 2;
  const cv = document.createElement('canvas'); cv.width = W*sc; cv.height = H*sc; const g = cv.getContext('2d'); g.scale(sc, sc);
  const F = (w, s) => `${w} ${s}px "IBM Plex Sans KR","Malgun Gothic",sans-serif`;
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#152033'; g.font = F(700, 17); g.fillText(p.input.name || '인허가 일정표', 16, 28);
  const { c } = effective(p);
  g.fillStyle = '#5b6678'; g.font = F(400, 11.5);
  g.fillText(`${c.sido} ${p.input.sgg||''} · ${c.zoneName} · ${USES[p.input.use]} · 연면적 ${fA(c.gfa)} · 지상 ${c.floors}층/지하 ${c.basements}층${c.hh?` · ${c.hh}세대`:''} · 판정 기준표 v${RULESET.version} (${RULESET.date})`, 16, 46);
  let y = TH;
  g.fillStyle = '#f0f3f8'; g.fillRect(0, y, W, HH);
  for (let m = 0; m < M; m++) {
    const x = LW + m*px, [yy, mo] = ymAdd(st.base, m);
    g.strokeStyle = mo===1 && st.axis==='ym' ? '#b9c2cf' : '#dfe4eb'; g.beginPath(); g.moveTo(x+.5, y); g.lineTo(x+.5, H-30); g.stroke();
    const lab = st.axis==='ym' ? (mo===1 || m===0 ? `${String(yy).slice(2)}.${mo}` : `${mo}`) : `${m+1}`;
    if (px >= 22 || m%2===0) { g.fillStyle = '#152033'; g.font = F(600, 10); g.textAlign = 'center'; g.fillText(lab, x + px/2, y + 28); g.textAlign = 'left'; }
  }
  g.fillStyle = '#5b6678'; g.font = F(500, 11); g.fillText(st.axis==='ym' ? '구분 · 항목                                   (연.월)' : '구분 · 항목                                 (개월차)', 12, y + 28);
  y += HH;
  for (const [k, l, rs] of ordered) {
    g.fillStyle = '#f0f3f8'; g.fillRect(0, y, W, GH);
    g.fillStyle = pal[k]; g.fillRect(12, y + 7, 8, 8);
    g.fillStyle = '#152033'; g.font = F(700, 11.5); g.fillText(l, 26, y + 15); y += GH;
    for (const r of rs) {
      g.strokeStyle = '#edf0f5'; g.beginPath(); g.moveTo(0, y + RH + .5); g.lineTo(W, y + RH + .5); g.stroke();
      g.fillStyle = '#152033'; g.font = F(400, 11.5);
      let nm = r.name + (r.tent ? ' (확인 필요)' : '');
      while (g.measureText(nm).width > LW - (st.showOwner ? 90 : 40) && nm.length > 4) nm = nm.slice(0, -2) + '…';
      g.fillText(nm, 26, y + 16);
      if (st.showOwner && r.owner) { g.fillStyle = '#5b6678'; g.font = F(400, 10.5); g.fillText(r.owner, LW - 58, y + 16); }
      const col = r.color || pal[r.cat], x = LW + r.start*px;
      if (r.ms) { g.save(); g.translate(x, y + RH/2); g.rotate(Math.PI/4); g.fillStyle = col; g.fillRect(-5, -5, 10, 10); g.restore();
        g.fillStyle = '#152033'; g.font = F(500, 10); g.fillText(fmtAt(st, r.start), x + 10, y + 16); }
      else {
        const w = Math.max(3, r.dur*px);
        g.fillStyle = col; g.globalAlpha = r.tent ? .55 : 1; g.fillRect(x, y + 5, w, RH - 10); g.globalAlpha = 1;
        if (r.tent) { g.setLineDash([3, 2]); g.strokeStyle = '#9a5a00'; g.strokeRect(x + .5, y + 5.5, w - 1, RH - 11); g.setLineDash([]); }
        const lbl = fmtDur(r.dur); g.font = F(500, 9.5);
        if (g.measureText(lbl).width + 8 < w) { g.fillStyle = LIGHT_TEXT.has(col) ? '#14202f' : '#ffffff'; g.fillText(lbl, x + 4, y + 15.5); }
        else { g.fillStyle = '#5b6678'; g.fillText(lbl, x + w + 4, y + 15.5); }
      }
      y += RH;
    }
  }
  g.strokeStyle = '#b9c2cf'; g.beginPath(); g.moveTo(LW + .5, TH); g.lineTo(LW + .5, y); g.stroke();
  g.fillStyle = '#5b6678'; g.font = F(400, 10); g.fillText('점선·반투명 막대: 판정 "확인 필요" 항목 · 기간은 실무 표준값이며 수정 가능 · 법적 판단을 대신하지 않음', 16, y + 20);
  return cv;
}
async function exportPdf(){
  if (!window.jspdf) throw new Error('PDF 모듈을 불러오지 못했습니다');
  const cv = await drawCanvas(), { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'landscape', unit:'mm', format:'a3' });
  const PW = 420, PH = 297, mg = 10, aw = PW - mg*2, ah = PH - mg*2;
  const scale = Math.min(aw / cv.width, ah / cv.height);
  if (cv.height * (aw / cv.width) <= ah || scale * cv.width >= aw * 0.6) {
    const w = cv.width * scale, h = cv.height * scale;
    doc.addImage(cv.toDataURL('image/png'), 'PNG', mg, mg, w, h);
  } else {
    const s = aw / cv.width, sliceH = Math.floor(ah / s);
    for (let y0 = 0, pg = 0; y0 < cv.height; y0 += sliceH, pg++) {
      const part = document.createElement('canvas'); part.width = cv.width; part.height = Math.min(sliceH, cv.height - y0);
      part.getContext('2d').drawImage(cv, 0, y0, cv.width, part.height, 0, 0, cv.width, part.height);
      if (pg) doc.addPage('a3', 'landscape');
      doc.addImage(part.toDataURL('image/png'), 'PNG', mg, mg, aw, part.height * s);
    }
  }
  await saveFile(fileBase() + '_인허가일정_A3.pdf', doc.output('blob'), 'application/pdf');
}

  const t = setTimeout(() => { if (store.mode==='local') setSave('이 브라우저에 저장됨', 'local'); }, 10000);
  await store.init();
  clearTimeout(t);
  let seen = null; try { seen = localStorage.getItem(LS+'.seen'); } catch(e) {}
  if (seen !== RULESET.version) showGuide();
  if (store.mode==='cloud') {
    try {
      const cloud = await store.list();
      if (cloud.length) { S.projects = cloud; openProject(cloud.slice().sort((a,b) => b.updatedAt-a.updatedAt)[0]); setTab(S.tab); }
      else { for (const p of S.projects) await store.put(p); }

    } catch(e) { store.mode = 'local'; setSave('클라우드 연결 실패 — 이 브라우저에 저장', 'local'); }
