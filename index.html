  const parking = section('주차 종류별 배분', 'peach', table(
    ['구분', '대수', '비율', '규칙'],
    P.pkSplit.map(r => `<tr>
      <td class="l">${esc(r.name)}</td><td>${f(r.n, 0)}</td>
      <td>${r.ratio === null ? '나머지' : f(r.ratio, 2) + '%'}</td>
      <td>${esc(r.rule)} · 기준 확인 필요</td>
    </tr>`).join('')
    + `<tr class="rv-tot">
      <td class="l">계</td><td>${f(P.pk, 0)}</td>
      <td>100%</td><td>계획 대수 기준</td>
    </tr>`
  ));

  const groups = [
    ['sale', '분양'], ['rent', '의무임대'], ['pub', '공공주택']
  ];
  const areaKeys = [
    'ex', 'common', 'supply', 'etcSum', 'pkArea', 'contract'
  ];

  const sumRows = rows => {
    const total = { hh:0 };
    areaKeys.forEach(key => {
      total[key] = rows.some(r => r.hh !== 0 && !finite(r[key]))
        ? null
        : rows.reduce(
          (sum, r) => sum + (r.hh === 0 ? 0 : r[key] * r.hh), 0
        );
    });
    total.hh = rows.reduce((sum, r) => sum + r.hh, 0);
    total.exRate =
      finite(total.ex) && finite(total.supply) && total.supply > 0
        ? total.ex / total.supply
        : null;
    return total;
  };

  const areaCells = row =>
    `<td>${f(row.hh, 0)}</td>${
      areaKeys.map(key => `<td>${f(row[key])}</td>`).join('')
    }<td>${
      finite(row.exRate)
        ? f(row.exRate * 100) + '%'
        : '입력 필요'
    }</td>`;

  const saleRows = groups.map(([grp, name]) => {
    const rows = P.rows.filter(r => r.grp === grp);
    return rows.map(r => {
      const t = Z.types.find(x => x.id === r.tid);
      return `<tr data-rvsale="${grp}">
        <td class="l">${esc(name)}</td>
        <td class="l">${esc(t ? t.name : r.tid)}</td>
        ${areaCells(r)}
      </tr>`;
    }).join('')
      + `<tr class="rv-tot">
        <td colspan="2">${esc(name)} 소계</td>
        ${areaCells(sumRows(rows))}
      </tr>`;
  }).join('')
    + `<tr class="rv-tot">
      <td colspan="2">합계</td>${areaCells(sumRows(P.rows))}
    </tr>`;

  const sale = `<details class="rv-sec rv-sale">
    <summary>분양면적표</summary>
    <p class="rv-note">
      타입 행은 세대당 면적, 소계·합계는 세대수를 곱한 면적입니다. 단위: ㎡.
    </p>
    ${table(
      ['구분', '타입', '세대', '전용', '공용', '공급',
        '기타공용', '주차장', '계약면적', '전용률'],
      saleRows
    )}
  </details>`;

  return warnings + hero + kpis + checks
    + overview + amenities + parking + sale;
}
function ovwNonCalc(Z, pc) {
  const rv = rvOf(pc), a = Z.asm, site = ovwNum(pc && pc.area);
  const up = site * rv.farPlan / 100;
  const ready = site > 0 && rv.farPlan > 0 && Number.isFinite(up);
  const lim = ovwLimits(pc);
  const far = site > 0 ? rv.farPlan : null;
  const bcr = site > 0 ? rv.bld / site * 100 : null;
  const pkLaw = rv.pkPer > 0 ? Math.round(up / rv.pkPer) : null;
  const pk = pkLaw;
  const pkArea = pk === null ? null : pk * a.pkArea;
  const dn = pkArea === null ? null : pkArea + rv.mepNon;
  const total = dn === null ? null : up + dn;
  const uses = rv.uses.map(r => ({ ...r, area:up * r.pct / 100 }));
  const mixSum = uses.reduce((s, r) => s + r.pct, 0);
  const room = lim.far && site > 0 ? lim.far.v * site / 100 - up : null;
  const checks = [
    {
      id:'far', name:'용적률',
      text:ready ? ovwFmt(far, 2) + '%' : '입력 필요',
      lim:lim.far
        ? ovwFmt(lim.far.v, 2) + '% 이하 · 출처 ' + lim.far.src
        : '한도 입력 필요',
      ok:ready && lim.far ? far <= lim.far.v : null
    },
    {
      id:'bcr', name:'건폐율',
      text:site > 0 ? ovwFmt(bcr, 2) + '%' : '입력 필요',
      lim:lim.bcr
        ? ovwFmt(lim.bcr.v, 2) + '% 이하 · 출처 ' + lim.bcr.src
        : '한도 입력 필요',
      ok:site > 0 && lim.bcr ? bcr <= lim.bcr.v : null
    },
    {
      id:'pk', name:'주차',
      text:ready && pk !== null ? ovwFmt(pk) + '대' : '입력 필요',
      lim:pkLaw === null ? '주차 기준 입력 필요'
        : '법정 ' + ovwFmt(pkLaw) + '대 이상 · 기준 확인 필요',
      ok:ready && pkLaw !== null ? pk >= pkLaw : null
    },
    {
      id:'mix', name:'용도 구성비 합',
      text:ovwFmt(mixSum, 2) + '%',
      lim:'100% · 허용 오차 0.05%p 미만',
      ok:Math.abs(mixSum - 100) < 0.05
    }
  ];
  return ovwFiniteTree({
    kind:'non', site, hh:0, rentHh:0, pubHh:0, small:0,
    u:{}, byB:{}, ex:0, wall:0, core:0, supply:0, retail:0, amenUp:0,
    uses, mixSum, up, pkLaw, pk, pkArea,
    pkSplit:pk === null ? [] : ovwSplitPk(pk, a),
    mepNon:rv.mepNon, dn, total, far, bcr, lim, room,
    land:site * (a.landLaw / 100 + 0.0001),
    open:site * (a.openLaw / 100 + 0.0001),
    contract:null, tSupply:{}, tContract:{}, checks
  });
}

function ovwSumFinite(values) {
  if (values.some(v => typeof v !== 'number' || !Number.isFinite(v))) return null;
  const n = values.reduce((s, v) => s + v, 0);
  return Number.isFinite(n) ? n : null;
}

function ovwFails(all) {
  return (Array.isArray(all) ? all : []).filter(c => c.ok === false).map(c => {
    const name = c.id === 'pub' ? '공공주택' : c.name;
    return c.who === '구역' ? name : (c.who || '획지') + ' ' + name;
  });
}

function ovwZone(inp) {
  const Z = reviewOf(inp);
  const C = parcelsOf(inp).map(pc => ({
    ...ovwParcel(Z, pc), id:pc.id, name:pc.name || '획지'
  }));
  const res = C.filter(c => c.kind === 'res');
  const non = C.filter(c => c.kind === 'non');
  const pcs = parcelsOf(inp);
  const sum = key => ovwSumFinite(C.map(c => c[key]));
  const sumRes = key => ovwSumFinite(res.map(c => c[key]));
  const site = sum('site'), up = sum('up'), dn = sum('dn');
  const hh = sum('hh'), pk = sum('pk'), pkLaw = sum('pkLaw');
  const rentHh = sumRes('rentHh'), pubHh = sumRes('pubHh');
  const allRent = ovwSumFinite([rentHh, pubHh]);
  const small = sumRes('small');
  const r40 = ovwSumFinite(res.map(c => {
    const rv = rvOf(pcs.find(p => p.id === c.id));
    return Z.types.reduce((s, t) =>
      s + (t.ex <= 40 ? (rv.rent[t.id] || 0) + (rv.pub[t.id] || 0) : 0), 0);
  }));
  const needRes = ovwSumFinite(res.map(c =>
    typeof c.contract === 'number' ? c.contract * Z.std.rentArea / 100 : null));
  const needNon = ovwSumFinite(non.map(c =>
    typeof c.total === 'number' ? c.total * Z.std.nonShare / 100 : null));
  const need = ovwSumFinite([needRes, needNon]);
  const plan = ovwSumFinite(res.map(c => {
    const rv = rvOf(pcs.find(p => p.id === c.id));
    return ovwSumFinite(Z.types.map(t => {
      const n = rv.rent[t.id] || 0;
      return n === 0 ? 0
        : typeof c.tContract[t.id] === 'number' ? n * c.tContract[t.id] : null;
    }));
  }));
  const percent = (n, d) =>
    typeof n === 'number' && typeof d === 'number' && d > 0
      && Number.isFinite(n / d * 100) ? n / d * 100 : null;
  const sm = percent(small, hh), rr = percent(allRent, hh);
  const forty = percent(r40, allRent);
  const R = Z.std;
  const checks = C.length ? [
    {
      id:'small', name:'85㎡ 이하 세대 (획지 합산)',
      text:sm === null ? '입력 필요' : ovwFmt(sm, 1) + '%',
      lim:'전체 세대의 ' + ovwFmt(R.small, 2) + '% 이상 · 고시 기준',
      ok:sm === null ? null : sm >= R.small
    },
    {
      id:'rent', name:'임대 세대 비율 (합산)',
      text:rr === null ? '입력 필요' : ovwFmt(rr, 1) + '%',
      lim:ovwFmt(R.rentMin, 2) + '% 이상 ' + ovwFmt(R.rentMax, 2)
        + '% 이하 · 고시 기준',
      ok:rr === null ? null : rr >= R.rentMin && rr <= R.rentMax
    },
    {
      id:'plan', name:'의무임대 계약면적 (합산)',
      text:plan === null ? '입력 필요' : ovwFmt(plan, 2) + '㎡',
      lim:'필요 ' + ovwFmt(need, 2) + '㎡ 이상 · 고시 기준',
      ok:need === null || plan === null ? null : plan >= need
    },
    {
      id:'r40', name:'40㎡ 이하 임대 (합산)',
      text:forty === null ? '입력 필요' : ovwFmt(forty, 1) + '%',
      lim:'임대의 ' + ovwFmt(R.r40min, 2) + '% 이상 '
        + ovwFmt(R.r40max, 2) + '% 이하 · 고시 기준',
      ok:forty === null ? null : forty >= R.r40min && forty <= R.r40max
    }
  ] : [];
  const all = C.flatMap(c => c.checks.map(k => ({ ...k, who:c.name })))
    .concat(checks.map(k => ({ ...k, who:'구역' })));
  return ovwFiniteTree({
    Z, C, site, up, dn, hh, pk, pkLaw, rentHh, pubHh, allRent,
    small, r40, needRes, needNon, need, plan, checks, all,
    tally:ovwTally(all), fails:ovwFails(all)
  });
}

function ovwCheckState(checks) {
  const t = ovwTally(checks);
  return t.no ? 'no' : t.need || !t.n ? 'need' : 'ok';
}

function ovwDots(inp) {
  const z = ovwZone(inp);
  const out = {
    zone:ovwCheckState(z.all),
    rent:ovwCheckState(z.checks.concat(
      z.C.filter(c => c.kind === 'res').flatMap(c =>
        c.checks.filter(k => k.id === 'pub'))
    )),
    asm:null
  };
  z.C.forEach(c => { out['p:' + c.id] = ovwCheckState(c.checks); });
  return out;
}

function ovwUseListEdit(inp, action, pid, id) {
  const no = { inp, ok:false };
  if (!inp || typeof inp !== 'object') return no;
  const pc = parcelsOf(inp).find(p => p.id === pid);
  if (!pc || rvOf(pc).kind !== 'non') return no;
  const rv = rvOf(pc);
  if (action === 'add') {
    if (!ovwId(id) || rv.uses.some(u => u.id === id)) return no;
  } else if (action === 'remove') {
    if (!rv.uses.some(u => u.id === id)) return no;
  } else return no;
  const out = JSON.parse(JSON.stringify(inp));
  const target = parcelsOf(out).find(p => p.id === pid);
  const next = rvOf(target);
  if (action === 'add') {
    let n = 1;
    const names = new Set(next.uses.map(u => u.name));
    while (names.has('용도 ' + n)) n++;
    next.uses.push({ id, name:'용도 ' + n, pct:0, use:'etc' });
  } else next.uses = next.uses.filter(u => u.id !== id);
  target.rv = next;
  return { inp:out, ok:true };
}

function ovwBadge(ok, text) {
  const cls = ok === true ? 'rv-ok' : ok === false ? 'rv-no' : 'rv-need';
  const label = text || (ok === true ? '충족' : ok === false ? '미달' : '입력 필요');

function ovwKpi(name, value, sub) {
  return `<div class="rv-kpi"><span>${esc(name)}</span>

function ovwMeter(value, limit) {
  const ready = typeof value === 'number' && Number.isFinite(value)
    && limit && limit.v > 0;
  if (!ready) return '<span class="rv-note">한도 또는 계획 입력 필요</span>';
  const width = Math.max(0, Math.min(100, value / limit.v * 100)).toFixed(1);
  return `<span>${ovwFmt(value, 2)}% / 한도 ${ovwFmt(limit.v, 2)}%</span>
    <div class="rv-gauge ${value <= limit.v ? 'rv-gauge-ok' : 'rv-gauge-no'}"
      role="img" aria-label="${esc('용적률 한도 대비 ' + width + '%')}">
      <span style="width:${width}%"></span></div>`;
}

function ovwInput(data, value, label, text = false) {
  const attrs = Object.entries(data).map(([k, v]) =>
    `data-${k}="${esc(v)}"`).join(' ');
  return `<input type="${text ? 'text' : 'number'}"
    ${text ? 'maxlength="60"' : 'min="0" step="any"'}
    ${attrs} value="${esc(value == null ? '' : value)}"
    aria-label="${esc(label)}">`;
}

function ovwOutput(out, key) {
  return `<span data-rvo="${esc(key)}">${esc(out[key] == null ? '' : out[key])}</span>`;
}

function ovwField(label, control, unit = '') {
  return `<div class="rv-field"><span class="rv-field-label">${esc(label)}</span>
    <span class="rv-field-value">${control}<span>${esc(unit)}</span></span></div>`;

function ovwRentResHtml(inp) {
  const z = ovwZone(inp);
  if (!z.C.some(c => c.kind === 'res')) {
    return '<p class="rv-note">주거 획지가 없습니다. 합산 판정은 구역 총괄에서 확인하세요.</p>';
  }
  const R = z.Z.std;
  const rows = z.C.map(c => {
    const res = c.kind === 'res';
    const base = res ? c.contract : c.total;
    const ratio = res ? R.rentArea : R.nonShare;
    const required = typeof base === 'number' ? base * ratio / 100 : null;
    let planned = 0;
    if (res) {
      const rv = rvOf(parcelsOf(inp).find(p => p.id === c.id));
      planned = ovwSumFinite(z.Z.types.map(t => {
        const n = rv.rent[t.id] || 0;
        return n === 0 ? 0
          : typeof c.tContract[t.id] === 'number' ? n * c.tContract[t.id] : null;
      }));
    }
    return `<tr><td class="l">${esc(c.name)}</td>
      <td class="l">${res ? '주거 계약면적' : '비주거 전체 연면적'}</td>
      <td>${ovwFmt(base, 2)}</td><td>${ovwFmt(ratio, 2)}%</td>
      <td>${ovwFmt(required, 2)}</td><td>${ovwFmt(planned, 2)}</td></tr>`;
  }).join('') + `<tr class="rv-tot"><td colspan="4">구역 합계</td>
    <td>${ovwFmt(z.need, 2)}</td><td>${ovwFmt(z.plan, 2)}</td></tr>`;
  const ready = typeof z.plan === 'number' && typeof z.need === 'number';
  const balance = ready ? z.plan - z.need : null;
  const note = balance === null ? '필요·계획 면적 입력 필요'
    : (balance >= 0 ? '여유 ' : '부족 ') + ovwFmt(Math.abs(balance), 2) + '㎡';
  const steps = z.C.filter(c => c.kind === 'res').map(c => {
    const rv = rvOf(parcelsOf(inp).find(p => p.id === c.id));
    const check = c.checks.find(k => k.id === 'pub');
    const pairs = [
      ['상한용적률 [고시]', rv.capFar, '%'],
      ['계획 용적률', c.far, '%'],
      ['완화 용적률', c.relief, '%'],
      ['그 50%', c.relief === null ? null : c.relief / 2, '%'],
      ['의무 연면적 = 대지 × 50%분', c.pubNeed, '㎡'],
      ['계획 공급면적 (' + ovwFmt(c.pubHh) + '세대)', c.pubPlan, '㎡']
    ];
    return `<div class="rv-sec"><p><strong>${esc(c.name)}</strong>
      ${ovwBadge(check.ok)}</p><div class="rv-steps">${
      pairs.map(([name, value, unit]) =>
        `<div><span>${esc(name)}</span><b>${ovwFmt(value, 2)}${esc(unit)}</b></div>`
      ).join('')
    }</div></div>`;
  }).join('');
  return ovwSection('합산 판정', 'rose', ovwChecksHtml(z.checks))
    + ovwSection('① 의무임대 계약면적', 'lav',
      ovwTable(['획지', '구분', '기준 면적(㎡)', '비율', '필요(㎡)', '계획(㎡)'], rows)
      + `<p class="rv-note">${esc(note)}</p>`)
    + ovwSection('② 획지별 공공주택', 'lav', steps
      + '<p class="rv-note">면적은 ㎡, 용적률은 %로 표시합니다.'
      + ' 고시·법령 기준은 원문 대조 전입니다.</p>');
}

const LS = 'permit-timeline.v1';
const store = {
  mode:'local', db:null, uid:null,
  async init(){
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.db = db; this.uid = id; this.mode = 'cloud';
    } catch(e) { this.mode = 'local'; }
  },
  col(){ return this.db.collection('data/users/' + this.uid); },
  async list(){
    if (this.mode==='cloud') { const s = await this.col().get(); return s.docs.map(d => d.data()).filter(Boolean).map(x => JSON.parse(JSON.stringify(x))); }
    try { return JSON.parse(localStorage.getItem(LS) || '[]'); }
    catch(e) { try { if (!localStorage.getItem(LS+'.corrupt')) localStorage.setItem(LS+'.corrupt', localStorage.getItem(LS)); } catch(_) {} return []; } // 다음 저장이 덮어쓰기 전에 원본을 한 번 남긴다
  },
  async put(p){
    const body = JSON.parse(JSON.stringify(p));
    if (this.mode==='cloud') return this.col().doc(p.id).set(body);
    const all = await this.list(); const i = all.findIndex(x => x.id===p.id); if (i>=0) all[i] = body; else all.push(body); localStorage.setItem(LS, JSON.stringify(all));
  },
  async del(id){
    if (this.mode==='cloud') return this.col().doc(id).delete();
    localStorage.setItem(LS, JSON.stringify((await this.list()).filter(x => x.id!==id)));
  }
};
let saveTimer = null, saving = Promise.resolve(), dirtyIds = new Set();
function setSave(t, cls){ const el = $('#saveSt'); el.className = 'save ' + (cls||''); el.querySelector('span').textContent = t; }
function touch(){
  const p = S.cur; if (!p) return;
  p.updatedAt = Date.now(); p.example = false; dirtyIds.add(p.id);
  setSave('저장 중', 'busy');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 1200);
}
function retryFlush(){ clearTimeout(saveTimer); saveTimer = setTimeout(flush, 5000); }
// 탭을 닫거나 숨길 때 1.2초 대기 중인 수정도 바로 저장한다 (브라우저 저장은 동기 호출이라 닫히기 전에 끝난다)
window.addEventListener('pagehide', () => { clearTimeout(saveTimer); if (dirtyIds.size) flush(); });
function flush(){
  const ids = [...dirtyIds]; dirtyIds.clear();
  saving = saving.then(async () => {
    try { for (const id of ids) { const p = S.projects.find(x => x.id===id); if (p) await store.put(p); }
      setSave(store.mode==='cloud' ? '저장됨' : '이 브라우저에 저장됨', store.mode==='cloud' ? '' : 'local');
    } catch(e) {
      if (store.mode==='cloud' && e && e.code==='invalid_argument') {
        // 보기 전용 권한 등으로 계정 저장이 막히면 이 브라우저 저장으로 전환
        store.mode = 'local';
        for (const p of S.projects) await store.put(p);
        setSave('보기 권한 — 이 브라우저에 저장됨', 'local');
        return;
      }
      // 브라우저 저장소는 code가 아니라 name으로 가득 참을 알린다. 실패해도 5초 뒤 다시 저장한다.
      setSave(e && (e.code==='quota_exceeded' || e.name==='QuotaExceededError') ? '저장 공간이 가득 찼습니다' : '저장 실패 — 다시 시도', 'busy'); ids.forEach(i => dirtyIds.add(i)); retryFlush();
    }
  }).catch(() => { setSave('저장 실패 — 다시 시도', 'busy'); ids.forEach(i => dirtyIds.add(i)); retryFlush(); }); // 실패한 채로 굳으면 이후 저장이 모두 건너뛰어진다
}

function renderGantt(){
  if (S.gv==='sched') return renderSched();
  const p = S.cur, st = p.settings, px = st.px, rows = view(p).rows;
  const body = $('#gBody');
  if (!rows.length) { body.innerHTML = `<div class="gempty">아직 일정이 없습니다.<br><br><button class="btn pri" id="gEmptyRun">판정하고 일정표 만들기</button><br><br><span class="note">01 사업 개요를 먼저 입력하세요.</span></div>`; return; }
  const M = spanMonths(rows), W = M*px, LW = leftW(st);
  const leftHead = `<div class="g-left" style="width:${LW}px"><div class="c-nm">구분 · 항목</div>${st.showOwner?'<div class="c-ow">담당</div>':''}${st.showNote?'<div class="c-nt">비고</div>':''}</div>`;
  let hm = '', hq = '';
  for (let m = 0; m < M; m++) {
    const [y, mo] = ymAdd(st.base, m);
    const lab = st.axis==='ym' ? (mo===1 || m===0 ? `${y}.${String(mo).padStart(2,'0')}` : `${mo}월`) : `${m+1}M`;
    const step = px < 36 ? 3 : 1;
    hm += `<div class="hm${st.axis==='ym'&&mo===1?' yr':''}" style="left:${m*px}px;width:${px}px">${m%step===0 || (st.axis==='ym'&&mo===1) ? lab : ''}</div>`;
    if (px >= 48) for (let q = 0; q < 4; q++) hq += `<div class="hq" style="left:${m*px + q*px/4}px;width:${px/4}px">${q+1}</div>`;
  }
  let html = `<div class="g-row g-head">${leftHead}<div class="g-time" style="width:${W}px">${hm}${hq}</div></div>`;
  const yMap = {}; let y = 44;
  const gridBg = `background-size:${px}px 100%`;
  for (const [cat, label] of CATS) {
    const rs = rows.filter(r => r.cat===cat); if (!rs.length) continue;
    html += `<div class="g-row grp" data-cat="${cat}"><div class="g-left" style="width:${LW}px"><div class="c-nm"><i style="width:8px;height:8px;border-radius:2px;background:${PALETTES[st.palette].c[cat]}"></i>${label}<em>${rs.length}</em></div></div><div class="g-time" style="width:${W}px"></div></div>`;
    y += 29;
    for (const r of rs) {
      yMap[r.id] = y + 15;
      const sel = S.sel===r.id, col = colorOf(r), x = r.start*px;
      const tag = r.tent ? '<span class="tag">확인 필요</span>' : '';
      let mark;
      if (r.ms) mark = `<div class="ms${sel?' sel':''}" data-id="${r.id}" style="left:${x}px" title="${esc(r.name)} · ${fmtAt(st, r.start)}"><i style="background:${col}"></i><span>${fmtAt(st, r.start)}</span></div>`;
      else {
        const w = Math.max(4, r.dur*px);
        mark = `<div class="bar${r.tent?' tent':''}${sel?' sel':''}${LIGHT_TEXT.has(col)?' dark-text':''}" data-id="${r.id}" style="left:${x}px;width:${w}px;background-color:${col}" title="${esc(r.name)} · ${fmtAt(st, r.start)} ~ ${fmtAt(st, endOf(r))} (${fmtDur(r.dur)})"><span class="h l"></span>${w>44 ? fmtDur(r.dur) : ''}<span class="h r"></span></div>`
          + (w<=44 ? `<div class="bar-lbl" style="left:${x+w+4}px">${fmtDur(r.dur)}</div>` : '');
      }
      html += `<div class="g-row item${sel?' sel':''}" data-row="${r.id}"><div class="g-left" style="width:${LW}px"><div class="c-nm" title="${esc(r.name)}">${esc(r.name)}${tag}</div>${st.showOwner?`<div class="c-ow">${esc(r.owner)}</div>`:''}${st.showNote?`<div class="c-nt" title="${esc(r.note)}">${esc(r.note)}</div>`:''}</div><div class="g-time" style="width:${W}px;${gridBg}">${mark}</div></div>`;
      y += 31;
    }
  }
  // 기준선(오늘)
  let today = '';
  if (st.axis==='ym' && st.todayLine) {
    const [by, bm] = (st.base||nowYM()).split('-').map(Number), d = new Date();
    const m = (d.getFullYear()*12 + d.getMonth()) - (by*12 + bm - 1) + (d.getDate()-1)/30;
    if (m >= 0 && m <= M) today = `<div class="today" style="left:${LW + m*px}px"><b>오늘</b></div>`;
  }
  // 선후관계 선

    for (const r of rows) for (const d of r.deps) {
      const a = rows.find(x => x.id===d); if (!a || yMap[a.id]==null || yMap[r.id]==null) continue;
      const hot = S.sel && (S.sel===r.id || S.sel===a.id);
      if (st.deps==='sel' && !hot) continue;
      const x1 = endOf(a)*px, y1 = yMap[a.id], x2 = r.start*px, y2 = yMap[r.id];
      const mx = Math.max(x1 + 6, Math.min(x2 - 6, x1 + 12));
      paths += `<path class="${hot?'hot':''}" d="M${x1} ${y1} H${mx} V${y2} H${x2 - 2}"/><path class="${hot?'hot':''}" d="M${x2-6} ${y2-3} L${x2-1} ${y2} L${x2-6} ${y2+3}"/>`;
    }
  }
  body.innerHTML = html + today + `<svg class="deps" style="left:${LW}px;top:0" width="${W}" height="${y}">${paths}</svg>`;
  // 프로젝트를 처음 열 때 오늘(연·월 표기) 6개월 전으로 이동
  if (S.needScroll && $('#gScroll').clientWidth > 0) { S.needScroll = false; const [by, bm] = (st.base||nowYM()).split('-').map(Number), d = new Date(); const tm = (d.getFullYear()*12 + d.getMonth()) - (by*12 + bm - 1); $('#gScroll').scrollLeft = st.axis==='ym' && tm > 6 ? (tm - 6)*px : 0; }
}
/* 분야별 일정표 (읽기 전용 보기, D-04·D-09): 줄 구성은 schedLanes(순수), 여기서는 rows를 읽어 SVG 한 장으로 그리기만 한다. 일정을 계산하거나 rows를 바꾸지 않는다. */
const SCHED_LW = 130, SCHED_NW = 190, SCHED_HEAD = 34, SCHED_BAR = 18, SCHED_TIER = 22, SCHED_LBL = 13, SCHED_MK = 10, SCHED_PAD = 6, SCHED_CH = 11;
function renderSched(){
  const p = S.cur, st = p.settings, px = st.px, v = view(p), el = $('#gSched');
  if (!v.rows.length) { el.innerHTML = `<div class="gempty">아직 일정이 없습니다.<br><br><button class="btn pri" id="gEmptyRun">판정하고 일정표 만들기</button><br><br><span class="note">01 사업 개요를 먼저 입력하세요.</span></div>`; return; }
  const lanes = schedLanes(v.rows, effective(v).E), M = spanMonths(v.rows), CW = M*px, W = SCHED_LW + CW + SCHED_NW, xOf = m => SCHED_LW + m*px;
  let head = '', grid = '';
  for (let m = 0; m < M; m++) {
    const [y, mo] = ymAdd(st.base, m), step = px < 36 ? 3 : 1;
    const lab = st.axis==='ym' ? (mo===1 || m===0 ? `${y}.${String(mo).padStart(2,'0')}` : `${mo}월`) : `${m+1}M`;
    if (m%step===0 || (st.axis==='ym' && mo===1)) { grid += `M${xOf(m)} ${SCHED_HEAD - 6}V@H `; head += `<text class="sh${st.axis==='ym' && mo===1 ? ' yr' : ''}" x="${xOf(m) + 2}" y="${SCHED_HEAD - 12}">${esc(lab)}</text>`; }
  }
  let y = SCHED_HEAD, bg = '', fg = '';
  lanes.forEach((ln, li) => {
    const bars = ln.items.filter(x => !x.ms), mss = ln.items.filter(x => x.ms), tw = n => String(n).length * SCHED_CH;
    const lv = packLevels(bars.map(x => ({ s:xOf(x.s), e:Math.max(xOf(x.e), xOf(x.s) + 3) })));
    // 라벨 단: 막대 안에 못 들어가는 이름, 마일스톤(날짜·이름), 통합심의 ▼ — 막대 단과 따로 겹침을 피한다
    const lbs = [];
    bars.forEach(x => { const w = Math.max(3, (x.e - x.s)*px); if (tw(x.name) > w - 6) lbs.push({ x:xOf(x.s), text:x.name, id:x.id }); });
    mss.forEach(x => lbs.push({ x:xOf(x.s) - 5, text:`${fmtAt(st, x.s)} ${x.name}`, id:x.id, tx:xOf(x.s) }));
    if (ln.bundle) lbs.push({ x:xOf(ln.bundle.s) - 5, text:'통합심의', bundle:ln.id, tx:xOf(ln.bundle.s) });
    lbs.forEach(l => { l.w = tw(l.text); l.end = l.x + l.w > W - 4; });
    const lt = packLevels(lbs.map(l => l.end ? { s:l.x + l.w - l.w, e:l.x + l.w } : { s:l.x, e:l.x + l.w }));
    const nLT = lbs.length ? Math.max(...lt) + 1 : 0, nBT = bars.length ? Math.max(...lv) + 1 : 0, mk = lbs.some(l => l.tx != null) ? SCHED_MK : 0;
    const top = y, mkY = top + SCHED_PAD + nLT*SCHED_LBL, barTop = mkY + mk, h = Math.max(30, SCHED_PAD*2 + nLT*SCHED_LBL + mk + nBT*SCHED_TIER);
    bg += `<rect x="0" y="${top}" width="${W}" height="${h}" class="sl-bg${li%2 ? ' alt' : ''}"/>`;
    let g = `<text class="sl-nm" x="8" y="${top + 18}">${esc(ln.label)}</text>`;
    bars.forEach((x, i) => {
      const col = colorOf(x.row), bx = xOf(x.s), w = Math.max(3, (x.e - x.s)*px), by = barTop + lv[i]*SCHED_TIER, inside = tw(x.name) <= w - 6;
      g += `<g class="sbar${x.tent ? ' tent' : ''}${LIGHT_TEXT.has(col) ? ' dk' : ''}" data-id="${esc(x.id)}"><title>${esc(x.name)} · ${esc(fmtAt(st, x.s))} ~ ${esc(fmtAt(st, x.e))}${x.tent ? ' (확인 필요)' : ''}</title><rect x="${bx}" y="${by}" width="${w}" height="${SCHED_BAR}" rx="3" fill="${esc(col)}"/>${inside ? `<text class="sbt" x="${bx + 4}" y="${by + 13}">${esc(x.name)}</text>` : ''}</g>`;
    });
    lbs.forEach((l, i) => {
      const ly = top + SCHED_PAD + lt[i]*SCHED_LBL + 10, tx = l.end ? l.x + l.w : l.x;
      if (l.tx != null) g += `<line class="sld" x1="${l.tx}" x2="${l.tx}" y1="${ly + 2}" y2="${mkY}"/>`;
      g += `<text class="slb${l.bundle ? ' bd' : ''}" x="${tx}" y="${ly}"${l.end ? ' text-anchor="end"' : ''}>${esc(l.text)}</text>`;
    });
    mss.forEach(x => { const mx = xOf(x.s), col = colorOf(x.row);
      g += `<g class="sms${x.tent ? ' tent' : ''}" data-id="${esc(x.id)}"><title>${esc(x.name)} · ${esc(fmtAt(st, x.s))}${x.tent ? ' (확인 필요)' : ''}</title><polygon points="${mx - 5},${mkY} ${mx + 5},${mkY} ${mx},${mkY + 9}" fill="${esc(col)}"/></g>`; });
    if (ln.bundle) { const mx = xOf(ln.bundle.s);
      g += `<g class="sbund" data-bundle="${esc(ln.id)}"><title>통합심의 · ${esc(fmtAt(st, ln.bundle.s))}</title><polygon points="${mx - 5},${mkY} ${mx + 5},${mkY} ${mx},${mkY + 9}"/></g>`; }
    g += ln.note.split(' · ').filter(Boolean).map((n, i) => `<text class="snote" x="${SCHED_LW + CW + 8}" y="${top + 16 + i*13}">${esc(n)}</text>`).join('');
    fg += `<g class="slane" data-lane="${esc(ln.id)}">${g}</g>`;
    y += h;
  });
  grid = grid.replace(/@H/g, y);
  el.innerHTML = `<svg class="ssvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${y}" width="${W}" height="${y}" role="img" aria-label="분야별 일정표">
    <rect x="0" y="0" width="${W}" height="${SCHED_HEAD}" class="sl-head"/>${bg}<path class="sgrid" d="${grid}"/>
    <text class="sh" x="8" y="${SCHED_HEAD - 12}">구분</text><text class="sh" x="${SCHED_LW + CW + 8}" y="${SCHED_HEAD - 12}">비고</text>${head}
    <path class="sgrid c" d="M${SCHED_LW} 0V${y}M${SCHED_LW + CW} 0V${y}"/>${fg}</svg>`;
}

/* 일정표 이벤트 */
$('#gTool').addEventListener('click', e => {
  const id = e.target.id, p = S.cur, st = p.settings;
  if (e.target.dataset && e.target.dataset.gv) { setGView(e.target.dataset.gv); return; }
  if (id==='gPrint') { window.print(); return; }
  if (id==='gAdd' || id==='gMs') {
    snap(); const base = S.sel && rowById(S.sel);
    const r = { id:uid(), cat: base ? base.cat : 'plan', name: id==='gMs' ? '새 마일스톤' : '새 항목', dur: id==='gMs' ? 0 : 2, start: base ? endOf(base) : 0,
      deps: base ? [base.id] : [], owner:'', note:'', ms: id==='gMs', tent:false, rule:null, color:'' };
    const idx = base ? p.rows.indexOf(base) + 1 : p.rows.length; p.rows.splice(idx, 0, r); S.sel = r.id; touch(); renderGanttAll(); renderFoot();
    setTimeout(() => { const n = $('#iName'); n && (n.focus(), n.select()); }, 0);
  }
  if (id==='gFix') { snap(); propagate(p.rows, true); touch(); renderGantt(); renderFoot(); toast('선후관계에 맞춰 뒤 항목을 밀거나 당겨 맞췄습니다'); }
  if (id==='gRegen') regenerate();
  if (id==='gZi' || id==='gZo') { st.px = Math.max(16, Math.min(160, st.px + (id==='gZi' ? 8 : -8))); touch(); renderTool(); renderGantt(); }
  if (id==='gFit') { const w = S.gv==='sched' ? $('#gSched').clientWidth - SCHED_LW - SCHED_NW - 20 : $('#gScroll').clientWidth - leftW(st) - 20; st.px = Math.max(16, Math.min(160, Math.floor(w / spanMonths(view(p).rows)))); touch(); renderTool(); renderGantt(); }
});
$('#gSched').addEventListener('click', e => { if (e.target.id==='gEmptyRun') regenerate(); });
$('#gBody').addEventListener('click', e => {
  if (e.target.id==='gEmptyRun') { regenerate(); return; }
  if (scopeParcel()) return;
  if (drag && drag.moved) return;
  const row = e.target.closest('[data-row]');
  if (row) { S.sel = row.dataset.row; renderGantt(); renderInsp(); }
  else if (e.target.closest('.g-time') || e.target.closest('.gbody')) { if (S.sel) { S.sel = null; renderGantt(); renderInsp(); } }
});
let drag = null;
$('#gBody').addEventListener('pointerdown', e => {
  if (scopeParcel()) return;
  const el = e.target.closest('.bar,.ms'); if (!el || e.button!==0) return;
  const r = rowById(el.dataset.id); if (!r) return;
  const mode = e.target.classList.contains('l') ? 'l' : e.target.classList.contains('r') ? 'r' : 'm';
  drag = { r, el, mode, x0:e.clientX, s0:r.start, d0:r.dur, moved:false, pre:snapOf(S.cur) };
  el.setPointerCapture(e.pointerId); e.preventDefault();
});
$('#gBody').addEventListener('pointermove', e => {
  if (!drag) return;
  const px = S.cur.settings.px, dm = Math.round(((e.clientX - drag.x0) / px) * 4) / 4;
  if (!drag.moved && Math.abs(e.clientX - drag.x0) < 3) return;
  drag.moved = true;
  const r = drag.r;
  if (drag.mode==='m') r.start = Math.max(0, drag.s0 + dm);
  else if (drag.mode==='r') r.dur = Math.max(0.25, drag.d0 + dm);
  else { const ns = Math.max(0, Math.min(drag.s0 + drag.d0 - 0.25, drag.s0 + dm)); r.dur = drag.d0 + (drag.s0 - ns); r.start = ns; }
  drag.el.style.left = r.start*px + 'px';
  if (!r.ms) drag.el.style.width = Math.max(4, r.dur*px) + 'px';
});
const endDrag = () => {
  if (!drag) return;
  const d = drag;
  if (d.moved) { S.hist.push(d.pre); if (S.hist.length>60) S.hist.shift(); S.fut = []; updUndo(); S.sel = d.r.id; touch(); renderGantt(); renderInsp(); renderFoot(); }
  else { S.sel = d.r.id; renderGantt(); renderInsp(); }
  setTimeout(() => { drag = null; }, 0);
};
$('#gBody').addEventListener('pointerup', endDrag);
$('#gBody').addEventListener('pointercancel', endDrag);

$('#insp').addEventListener('change', e => {
  const t = e.target, p = S.cur, st = p.settings;
  if (t.id==='sBase') { snap(); st.base = t.value || nowYM(); touch(); renderGantt(); renderInsp(); return; }
  if (t.dataset.tg) { snap(); st[t.dataset.tg] = t.checked; touch(); renderGantt(); return; }
  if (t.id==='iAddDep' && t.value) {
    const r = rowById(S.sel), reaches = (id, seen = new Set()) => id===r.id || (!seen.has(id) && (seen.add(id), (rowById(id)?.deps || []).some(d => reaches(d, seen))));
    if (reaches(t.value)) { toast('순환이 생겨 선행 항목으로 넣을 수 없습니다'); renderInsp(); return; } // 새 선행이 이 항목을 거쳐 돌아오면 거부
    snap(); r.deps.push(t.value); touch(); renderGantt(); renderInsp(); return;
  }
  const k = t.dataset.e; if (!k) return;
  const r = rowById(S.sel); if (!r) return;
  snap();
  if (k==='start' || k==='dur') r[k] = Math.max(k==='dur' ? 0.25 : 0, Math.round((+t.value||0)*4)/4);
  else if (k==='ms' || k==='tent') r[k] = t.checked;

  touch(); renderGantt(); renderInsp(); renderFoot();
});
$('#insp').addEventListener('click', async e => {

function delRow(){

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName||'').toLowerCase(), typing = ['input','textarea','select'].includes(tag);
  if ((e.ctrlKey||e.metaKey) && !typing && e.key.toLowerCase()==='z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  if ((e.ctrlKey||e.metaKey) && !typing && e.key.toLowerCase()==='y') { e.preventDefault(); redo(); }

});

$('#vReview').addEventListener('change', e => {

$('#vReview').addEventListener('click', async e => {
  const add = e.target.closest('[data-rvadd]');
  const remove = e.target.closest('[data-rvrm]');
  if (add || remove) {
    if (!S.cur) return;
    const button = add || remove;
    const kind = add ? button.dataset.rvadd : button.dataset.rvrm;
    if (!['type', 'bld', 'use'].includes(kind)) return;
    const action = add ? 'add' : 'remove';
    const pid = button.dataset.pid;
    let id = button.dataset.id, result;
    if (kind === 'type') {
      if (add) {
        const existing = new Set(reviewOf(S.cur.input).types.map(t => t.id));
        do { id = uid(); } while (existing.has(id));
      }
      result = ovwTypeListEdit(S.cur.input, action, id);
    } else {
      const pc = parcelsOf(S.cur.input).find(p => p.id === pid);
      if (!pc) return;
      const rv = rvOf(pc);
      if (kind === 'bld' ? rv.kind !== 'res' : rv.kind !== 'non') return;
      const list = kind === 'bld' ? rv.blds : rv.uses;
      if (add) {
        const existing = new Set(list.map(x => x.id));
        do { id = uid(); } while (existing.has(id));
      }
      result = kind === 'bld'
        ? ovwBldListEdit(S.cur.input, action, pid, id)
        : ovwUseListEdit(S.cur.input, action, pid, id);
    }
    if (!result.ok) return;
    snap();
    S.cur.input = result.inp;
    touch();
    renderReview();
    return;
  }
  const tab = e.target.closest('[data-rvtab]');
  if (tab) {
    rvTab = tab.dataset.rvtab;
    renderReview();
    return;
  }
  const button = e.target.closest('[data-rvx]');
  if (!button || !S.cur) return;
  if (button.dataset.rvx === 'add1') { // 택지개발·주택건설: 획지 1개. 사업 개요 규모 칸(전체 규모 방식)은 그대로 둔다
    const p = S.cur; snap();
    const pc = { id:uid(), name:'획지 1', zone:p.input.zone, area:'', far:'', bcr:'', resRatio:'', path:'' };
    p.input = { ...p.input, parcels:[...parcelsOf(p.input), pc], inputMode: p.input.inputMode || 'total' };
    touch(); rvTab = 'p:' + pc.id; renderReview(); renderFoot();
  }
  if (button.dataset.rvx === 'sample') {
    const sample = ovwSample(uid);
    snap();
    S.cur.input = {
      ...S.cur.input, review:sample.review, parcels:sample.parcels
    };
    touch();
    rvTab = 'zone';
    renderReview();
  }
  if (button.dataset.rvx === 'apply') await ovwApply();
  if (button.dataset.rvx === 'xlsx') await ovwExport();
});

  const a = (i.auto || {})[k];

async function ovwApply(){
  const p = S.cur;
  if (!p) return;
  const source = p.input;
  const plan = ovwApplyPlan(source);
  if (!plan.rows.length) {
    toast('반영할 획지가 없습니다');
    return;
  }
  const diff = ovwApplyDiff(source, plan);
  if (!diff.rows.length && !diff.proj.length) {

    return;

    return;
  }

  const inp = JSON.parse(JSON.stringify(source));

  let local = await store.list();
  S.projects = local.length ? local : [makeProject(true)];
  openProject(S.projects.slice().sort((a,b) => b.updatedAt-a.updatedAt)[0]);
  setTab(tab);
  setSave('이 브라우저에 저장됨', 'local');
  const t = setTimeout(() => { if (store.mode==='local') setSave('이 브라우저에 저장됨', 'local'); }, 10000);
  await store.init();
  clearTimeout(t);
  let seen = null; try { seen = localStorage.getItem(LS+'.seen'); } catch(e) {}
  if (seen !== RULESET.version) showGuide();
  if (store.mode==='cloud') {
    try {
      const cloud = await store.list();
      if (cloud.length) { S.projects = cloud; openProject(cloud.slice().sort((a,b) => b.updatedAt-a.updatedAt)[0]); setTab(S.tab); }
      else { for (const p of S.projects) await store.put(p); }
      setSave('저장됨');
    } catch(e) { store.mode = 'local'; setSave('클라우드 연결 실패 — 이 브라우저에 저장', 'local'); }
  }
})();
</script>
